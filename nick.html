<style>
:root{
  --canvas:  #1A1613;   /* 擂台燈外的黑 */
  --rope:    #E8E2D4;   /* 拳擊台繩色 · 主文字 */
  --blood:   #A32A1E;   /* 血紅 · 強調 */
  --gold:    #C9964A;   /* 冠軍腰帶金 */
  --dim:     #8A7F74;
  --line:    #3A322B;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--canvas);
  color:var(--rope);
  font-family:'Noto Sans TC',system-ui,sans-serif;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
}

/* 擂台燈：頁面頂端的一圈光 */
body::before{
  content:"";
  position:fixed;
  top:-30vh;left:50%;
  width:120vw;height:80vh;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at center,
    rgba(201,150,74,.13) 0%,
    transparent 65%);
  pointer-events:none;
  z-index:0;
}

.wrap{
  max-width:820px;
  margin:0 auto;
  padding:0 22px 90px;
  position:relative;
  z-index:1;
}

/* ---------- 麵包屑 ---------- */
.back{
  display:inline-block;
  margin:28px 0 0;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.12em;
  color:var(--dim);
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:color .2s,border-color .2s;
}
.back:hover,.back:focus-visible{color:var(--gold);border-bottom-color:var(--gold)}

/* ---------- HERO：對戰海報 ---------- */
.hero{
  margin-top:26px;
  border:2px solid var(--rope);
  padding:30px 26px 26px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.hero .eyebrow{
  font-family:'Oswald',sans-serif;
  font-size:12px;
  letter-spacing:.4em;
  color:var(--gold);
  text-transform:uppercase;
}

.hero .name-en{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:clamp(46px,11vw,104px);
  line-height:.92;
  letter-spacing:.01em;
  margin:12px 0 4px;
  text-transform:uppercase;
  /* 逐字進場 */
  opacity:0;
  animation:punch-in .55s cubic-bezier(.2,1.2,.3,1) .15s forwards;
}

.hero .name-zh{
  font-size:clamp(18px,4vw,26px);
  font-weight:900;
  letter-spacing:.28em;
  color:var(--rope);
  opacity:0;
  animation:fade-up .5s ease .5s forwards;
}

.hero .vitals{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.14em;
  color:var(--dim);
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid var(--line);
  opacity:0;
  animation:fade-up .5s ease .7s forwards;
}
.hero .vitals b{color:var(--rope);font-weight:700}

@keyframes punch-in{
  0%{opacity:0;transform:scale(1.35)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes fade-up{
  0%{opacity:0;transform:translateY(10px)}
  100%{opacity:1;transform:translateY(0)}
}

/* ---------- 區塊 ---------- */
section{margin-top:56px}

.sec-head{
  display:flex;
  align-items:baseline;
  gap:12px;
  margin-bottom:18px;
}
.sec-head h2{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:15px;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--gold);
  white-space:nowrap;
}
.sec-head::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--line);
}

p.body{font-size:14.5px;color:#CFC6B8}
p.body + p.body{margin-top:14px}

/* ---------- 數值條（簽名元素）---------- */
.stats{display:flex;flex-direction:column;gap:14px}

.stat-row{display:grid;grid-template-columns:78px 1fr 40px;gap:12px;align-items:center}

.stat-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:.1em;
  color:var(--dim);
}

.stat-track{
  height:9px;
  background:var(--line);
  position:relative;
  overflow:hidden;
}

.stat-fill{
  height:100%;
  background:var(--blood);
  width:0;
  transition:width 1.1s cubic-bezier(.2,.9,.3,1);
}
.stat-fill.gold{background:var(--gold)}

.stat-num{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--rope);
  text-align:right;
}

/* ---------- 引言 ---------- */
blockquote{
  border-left:3px solid var(--blood);
  padding:4px 0 4px 20px;
  font-size:16px;
  line-height:1.85;
  color:var(--rope);
}
blockquote cite{
  display:block;
  margin-top:10px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  font-style:normal;
  letter-spacing:.1em;
  color:var(--dim);
}

/* ---------- 圖庫 ---------- */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;
}
.gallery img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
  border:1px solid var(--line);
  background:var(--line);
  transition:transform .35s ease,border-color .35s ease;
}
.gallery img:hover{transform:scale(1.03);border-color:var(--gold)}

/* ---------- 平台連結 ---------- */
.plays{display:flex;flex-direction:column;gap:10px}

.play{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  border:1px solid var(--line);
  padding:14px 18px;
  text-decoration:none;
  color:var(--rope);
  transition:border-color .25s,background .25s,padding-left .25s;
}
.play:hover,.play:focus-visible{
  border-color:var(--gold);
  background:rgba(201,150,74,.06);
  padding-left:24px;
}
.play:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.play .pname{font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:.1em}
.play .pnote{font-size:11.5px;color:var(--dim);margin-top:-2px}
.play .arrow{color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:14px}

.tag-nsfw{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  font-weight:700;
  letter-spacing:.12em;
  border:1px solid var(--blood);
  color:var(--blood);
  padding:1px 6px;
  margin-left:8px;
}

/* ---------- 頁尾 ---------- */
footer{
  margin-top:70px;
  padding-top:18px;
  border-top:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:.1em;
  color:var(--dim);
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}
footer a{color:var(--dim);text-decoration:none}
footer a:hover{color:var(--gold)}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
  .hero .name-en,.hero .name-zh,.hero .vitals{opacity:1}
}
</style>

<script>
// 數值條滾到才長出來
const fills = document.querySelectorAll('.stat-fill');
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.style.width = e.target.dataset.val + '%';
      io.unobserve(e.target);
    }
  });
}, {threshold: .4});
fills.forEach(f => io.observe(f));
</script>
