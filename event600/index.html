<meta property="og:title" content="600 追感謝活動">
<meta property="og:description" content="留言你和 Matcha_ 角色的遊玩片段，符合規則的每個人都有翅膀。">

<meta property="og:url" content="https://matchadev01.github.io/event600/">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
:root{--paper:#ECEDE8;--ink:#111;--g:#9BD14B;--g2:#6E9F2A;--white:#fff;--r:22px;--err:#d23c3c}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Noto Sans KR","Noto Sans JP",system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden;
background-image:radial-gradient(rgba(17,17,17,.07) 1px,transparent 1.2px);background-size:14px 14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 90px;position:relative}

/* language */
.langs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:26px}
.langs button{background:var(--white);border:2.5px solid var(--ink);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.langs button.on{background:var(--ink);color:var(--g)}
html:lang(ja) body{font-family:"Noto Sans JP","Noto Sans TC",system-ui,sans-serif}
html:lang(ko) body{font-family:"Noto Sans KR","Noto Sans TC",system-ui,sans-serif}
html:lang(en) h1,html:lang(es) h1,html:lang(ko) h1,html:lang(ja) h1{font-size:clamp(38px,10vw,92px)}
html:lang(ko) body{word-break:keep-all}
/* header */
header{text-align:center;padding:64px 0 30px}
h1{font-weight:900;font-size:clamp(50px,13vw,112px);line-height:1;letter-spacing:.02em;display:inline-block;
text-shadow:4px 4px 0 var(--g),8px 8px 0 var(--ink)}
.en{font-family:"Rubik Mono One",sans-serif;font-size:clamp(13px,3.2vw,20px);letter-spacing:.18em;margin-top:18px}
.intro{max-width:520px;margin:20px auto 0;font-size:15px;font-weight:500}
.tags{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.tag{display:inline-block;background:var(--ink);color:var(--g);font-weight:700;font-size:13px;padding:4px 14px;border-radius:99px;transform:rotate(-2deg)}
.stats{display:flex;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.st{background:var(--white);border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:10px 22px;min-width:150px}
.st.g{background:var(--g)}
.st b{display:block;font-family:"Rubik Mono One",sans-serif;font-size:clamp(28px,7vw,40px);line-height:1.2}
.st small{display:block;font-size:13px;font-weight:900}

/* sections */
.sec{background:var(--white);border:3px solid var(--ink);border-radius:var(--r);box-shadow:6px 6px 0 var(--ink);padding:26px 22px 24px;margin-top:30px}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.num{font-family:"Rubik Mono One",sans-serif;background:var(--g);border:3px solid var(--ink);border-radius:99px;padding:2px 12px;font-size:15px;transform:rotate(-4deg)}
.sec h2{font-size:clamp(20px,4.6vw,26px);font-weight:900;line-height:1.3}
.hint{font-size:14px;color:#555;margin-top:8px}
.limit{font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:99px;padding:0 9px;margin-left:auto;white-space:nowrap}

/* steps & rules */
.steps{list-style:none;counter-reset:s;margin-top:16px;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-weight:500}
.steps li::before{content:counter(s);font-family:"Rubik Mono One",sans-serif;font-size:14px;width:30px;height:30px;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--paper)}
.steps code{white-space:nowrap;font-family:inherit;font-weight:700;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:0 6px}

/* prizes */
.prizes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.pz{border:3px solid var(--ink);border-radius:16px;padding:14px 10px 12px;text-align:center;background:var(--paper)}
.pz.main{background:var(--g);box-shadow:4px 4px 0 var(--ink)}
.pz .lb{font-size:14px;font-weight:900}
.pz b{display:block;font-family:"Rubik Mono One",sans-serif;font-size:clamp(20px,4.4vw,28px);line-height:1.3;margin-top:4px}
.pz small{display:block;font-size:12px;font-weight:700;color:#444}
.time{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:16px}
.time span{font-size:13px;font-weight:700;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:2px 12px}

/* form */
.fld{margin-top:20px}
.fld:first-of-type{margin-top:16px}
.fld>label{display:block;font-weight:900;font-size:16px}
.fld>label .rq{color:var(--err);margin-left:2px}
.fld .sub{display:block;font-size:13px;color:#555;font-weight:500}
textarea,.inp{width:100%;margin-top:8px;border:2.5px solid var(--ink);border-radius:14px;padding:11px 14px;background:var(--paper);font-size:16px;outline:none;resize:vertical;appearance:none;-webkit-appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
textarea{min-height:100px}
textarea:focus,.inp:focus{background:var(--white);box-shadow:3px 3px 0 var(--g)}
.bad{border-color:var(--err)!important;box-shadow:3px 3px 0 var(--err)!important}
.msg{font-size:13px;font-weight:700;color:var(--err);min-height:1.2em;margin-top:4px}
.ok-msg{color:var(--g2)}
.idpic{display:block;width:100%;max-width:420px;margin-top:10px;border:2.5px solid var(--ink);border-radius:14px}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:22px;font-size:14px;font-weight:700;cursor:pointer;user-select:none;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px}
.agree input{width:20px;height:20px;margin-top:2px;accent-color:var(--g2);flex:none}

/* submit */
.go{display:block;margin:38px auto 0;background:var(--g);border:3px solid var(--ink);border-radius:99px;padding:14px 56px;font-size:22px;font-weight:900;box-shadow:6px 6px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.go:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.go:disabled{opacity:.6;cursor:wait}
.full{display:none;margin-top:22px;background:#FFE08A;border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700}
#m-go{text-align:center;margin-top:12px}
.note{text-align:center;font-size:13px;color:#666;margin-top:10px}

#done,#closed{display:none}
.thanks{text-align:center;padding:10px 0 4px}
.thanks .big{font-size:56px;line-height:1}
.thanks h2{font-size:clamp(26px,6vw,38px);margin-top:10px}
.thanks p{margin-top:8px;color:#555}

footer{margin-top:60px;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:20px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-weight:700;font-size:14px}
footer a{color:var(--g);text-decoration:none}
footer a:hover{text-decoration:underline}

#matchaHome{position:fixed;left:16px;bottom:16px;z-index:20;background:var(--g);color:var(--ink);text-decoration:none;font-weight:900;font-size:14px;padding:8px 18px;border:3px solid var(--ink);border-radius:99px;box-shadow:3px 3px 0 var(--ink)}

@media (max-width:600px){
  header{padding-top:40px}
  .sec{padding:22px 16px 20px;box-shadow:4px 4px 0 var(--ink)}
  .prizes{grid-template-columns:1fr;gap:10px}
  .pz{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:10px 14px}
  .pz b{margin:0}
  .pz .lb small{display:block}
  .go{width:100%;padding:14px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $ = id => document.getElementById(id);

// 語言
let L = "zh";
try { L = localStorage.getItem("m600_lang") || ""; } catch (e) {}
if (!T[L]) {
  const nav = (navigator.language || "zh").toLowerCase();
  L = nav.startsWith("ko") ? "ko" : nav.startsWith("ja") ? "ja" : nav.startsWith("es") ? "es" : nav.startsWith("zh") ? "zh" : "en";
}
const t = k => T[L][k];
let lastCount = null, zone = "seat";

function applyLang(l) {
  L = l;
  try { localStorage.setItem("m600_lang", l); } catch (e) {}
  document.documentElement.lang = { zh: "zh-Hant", en: "en", ko: "ko", ja: "ja", es: "es" }[l];
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t(el.dataset.t);
    if (typeof v === "string") el.innerHTML = v;
  });
  $("doneTxt").innerHTML = t(zone === "draw" ? "doneWait" : "doneSeat");
  $("dl").textContent = t("wave") + t("end");
  $("idpic").alt = t("imgAlt");
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  if (lastCount !== null) showSeats(lastCount);
  // 清掉舊語言的錯誤訊息
  document.querySelectorAll(".msg").forEach(m => { m.textContent = ""; });
  document.querySelectorAll(".bad").forEach(x => x.classList.remove("bad"));
  if ($("url").value.trim()) checkUrl();
}
document.querySelectorAll("#langs button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.l)));

const sel = $("chara");
CHARAS.forEach(n => {
  const o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o);
});

// 截止
if (CONFIG.DEADLINE && Date.now() > new Date(CONFIG.DEADLINE).getTime()) {
  $("form").style.display = "none";
  $("closed").style.display = "block";
}

let vid = "";
try {
  vid = localStorage.getItem("m600_vid") || "";
  if (!vid) { vid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("m600_vid", vid); }
} catch (e) {}

// 名額
function showSeats(count) {
  lastCount = count;
  const left = CONFIG.CAP - count;
  $("nNow").textContent = t("now")(count);
  if (left > 0) {
    $("nLeft").textContent = t("left")(left);
    $("nLeftLb").textContent = t("nLeftLb");
    $("full").style.display = "none";
  } else {
    $("nLeft").textContent = t("fullTxt");
    $("nLeftLb").textContent = t("fullLb");
    $("full").style.display = "block";
  }
}

const normHandle = s => s.trim().replace(/^@+/, "").toLowerCase();
const URL_RE = /^https?:\/\/(?:www\.)?threads\.(?:net|com)\/@([A-Za-z0-9._]+)\/post\/([A-Za-z0-9_-]+)/i;
const SHARE_RE = /^https?:\/\/(?:www\.)?threads\.(?:net|com)\/share\/([A-Za-z0-9_-]+)/i;

function setMsg(id, text, ok) {
  const m = $("m-" + id);
  m.textContent = text || "";
  m.className = "msg" + (ok ? " ok-msg" : "");
  const input = $(id);
  if (input) input.classList.toggle("bad", !!text && !ok);
}

// 連結裡的帳號要跟填的 Threads 帳號一樣
function checkUrl() {
  const u = $("url").value.trim();
  if (!u) { setMsg("url", ""); return null; }
  const sh = u.match(SHARE_RE);
  if (sh) { setMsg("url", t("ok_url"), true); return { share: sh[1] }; }
  const m = u.match(URL_RE);
  if (!m) { setMsg("url", t("e_urlBad")); return false; }
  const th = normHandle($("th").value);
  if (th && m[1].toLowerCase() !== th) { setMsg("url", t("e_urlMis")(m[1])); return false; }
  setMsg("url", t("ok_url"), true);
  return m;
}
$("url").addEventListener("input", checkUrl);
$("th").addEventListener("input", () => { if ($("url").value.trim()) checkUrl(); });

applyLang(L);

if (CONFIG.API.startsWith("http")) {
  fetch(CONFIG.API).then(r => r.json()).then(d => {
    if (d && typeof d.count === "number") showSeats(d.count);
  }).catch(() => {});
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  let ok = true;

  const cid = $("cid").value.trim().replace(/^@+/, "");
  if (!cid) { setMsg("cid", t("e_cid")); ok = false; }
  else if (/\s/.test(cid)) { setMsg("cid", t("e_cidSp")); ok = false; }
  else setMsg("cid", "");

  const th = normHandle($("th").value);
  if (!th) { setMsg("th", t("e_th")); ok = false; }
  else if (!/^[a-z0-9._]+$/.test(th)) { setMsg("th", t("e_thCh")); ok = false; }
  else setMsg("th", "");

  let m = null;
  if (!$("url").value.trim()) { setMsg("url", t("e_url")); ok = false; }
  else { m = checkUrl(); if (!m) ok = false; }

  const chara = sel.value;
  if (!chara) { setMsg("chara", t("e_chara")); sel.classList.add("bad"); ok = false; }
  else { setMsg("chara", ""); sel.classList.remove("bad"); }

  if (!$("agree").checked) { $("m-agree").textContent = t("e_agree"); ok = false; }
  else $("m-agree").textContent = "";

  if (!ok) {
    const first = document.querySelector(".bad, #agree:not(:checked)");
    if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  const payload = {
    cid, th,
    url: m.share ? "https://www.threads.com/share/" + m.share : "https://www.threads.com/@" + m[1] + "/post/" + m[2],
    post: m.share ? "share:" + m.share : m[2],
    chara, say: $("say").value.trim(), vid, lang: L
  };

  $("go").disabled = true;
  $("go").textContent = t("sending");
  $("m-go").textContent = "";

  try {
    const r = await fetch(CONFIG.API, { method: "POST", body: JSON.stringify(payload) });
    const txt = await r.text();
    let d;
    try { d = JSON.parse(txt); }
    catch (x) { $("m-go").textContent = t("e_back"); console.log(txt.slice(0, 500)); throw "shown"; }
    if (d.ok) {
      if (typeof d.count === "number") showSeats(d.count);
      zone = d.zone === "draw" ? "draw" : "seat";
      $("doneTxt").innerHTML = t(zone === "draw" ? "doneWait" : "doneSeat");
      $("form").style.display = "none";
      $("done").style.display = "block";
      window.scrollTo({ top: $("done").offsetTop - 20, behavior: "smooth" });
      return;
    }
    const why = {
      cid: ["cid", "d_cid"], th: ["th", "d_th"], url: ["url", "d_url"], closed: ["go", "d_closed"]
    }[d.dup || d.err];
    if (why) setMsg(why[0], t(why[1])); else $("m-go").textContent = t("e_fail");
  } catch (err) {
    if (err !== "shown") $("m-go").textContent = t("e_net");
  }
  $("go").disabled = false;
  $("go").textContent = t("go");
});
</script>
</body>
</html>
