<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鴨答角色取向表｜抹茶屋</title>
<meta name="description" content="鴨答角色取向表填表小工具。抹茶的角色一鍵放進去，也可以上傳自己的圖，最後匯出圖片。">
<meta property="og:title" content="鴨答角色取向表｜抹茶屋">
<meta property="og:description" content="把本命裝進一盒。抹茶的角色一鍵放進去，也可以上傳自己的圖。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#f7f9f5;--grid:rgba(20,160,92,.09);
  --ink:#111312;--ink2:#4a504c;--mute:#8b928d;
  --green:#14a05c;--green-d:#0b7a45;--mint:#dff3e7;--mint2:#bfe8cf;--hi:#ffe066;
  --sans:'Noto Sans TC',system-ui,-apple-system,sans-serif;
  --hand:'LXGW WenKai TC','Noto Sans TC',cursive;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
button,input{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;gap:12px;padding:18px 0 14px;flex-wrap:wrap}
.logo{width:40px;height:40px;flex:none;border-radius:10px;background:var(--green);border:2px solid var(--ink);display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;box-shadow:3px 3px 0 var(--ink)}
.brand b{display:block;font-size:17px;font-weight:900}
.brand span{font-size:12.5px;color:var(--ink2)}
.home{margin-left:auto;font-family:var(--hand);font-size:17px;color:var(--green-d);text-decoration:none}
.home:hover{text-decoration:underline}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

.box{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.stage{padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:5px 14px;font-weight:700;font-size:14px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--green);color:#fff}
canvas#cv{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #e3e6e3;touch-action:none;cursor:pointer}
canvas#cv.drag-over{outline:3px dashed var(--green);outline-offset:3px}
.tip{font-size:12.5px;color:var(--ink2);margin:8px 2px 0;line-height:1.6}

.side{display:flex;flex-direction:column;gap:16px}
@media (min-width:901px){.side{position:sticky;top:12px;max-height:calc(100vh - 24px)}}
.panel{padding:12px 14px}
.panel h2{margin:0 0 8px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.panel h2 small{font-weight:400;color:var(--mute);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.main{background:var(--green);color:#fff}
.btn.big{padding:10px 16px;font-size:15px;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
label.chk{display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer}
input[type=text]{border:2px solid var(--ink);border-radius:8px;padding:5px 8px;width:100%;font-size:14px}
input[type=range]{width:100%;accent-color:var(--green)}
.slotinfo{font-size:13px;color:var(--ink2);margin-bottom:8px}
.slotinfo b{color:var(--ink);font-size:15px}
.field{margin:8px 0}
.field span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}

.trayp{display:flex;flex-direction:column;min-height:0;flex:1}
.tray{overflow:auto;min-height:120px;padding:2px 2px 6px}
@media (max-width:900px){.tray{max-height:none}.trayp{order:-1}.tray .grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}}
.tray h3{font-size:12.5px;color:var(--ink2);margin:10px 0 6px;font-weight:700}
.tray h3:first-child{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.it{position:relative;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--mint);cursor:pointer;aspect-ratio:3/4;padding:0}
.it img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;pointer-events:none}
.it span{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);font-size:11px;line-height:1.3;padding:3px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.it .del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:12px;line-height:1;display:none;place-items:center;cursor:pointer}
.it:hover .del{display:grid}
.it:hover{box-shadow:0 0 0 3px var(--hi)}
.up{border:2px dashed var(--green);background:#fff;color:var(--green-d);display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.4;aspect-ratio:3/4;border-radius:10px;cursor:pointer}
.msg{font-size:12.5px;color:var(--ink2);line-height:1.6;background:var(--mint);border-radius:8px;padding:8px 10px}
.msg .btn{margin-top:6px}
.hl{animation:hl 1s ease 2}
@keyframes hl{50%{box-shadow:0 0 0 4px var(--hi),4px 4px 0 var(--ink)}}

dialog{border:2px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:14px;max-width:min(560px,94vw)}
dialog::backdrop{background:rgba(17,19,18,.45)}
dialog img{width:100%;display:block;border-radius:8px;border:1px solid #e3e6e3}
dialog p{font-size:13px;color:var(--ink2);margin:10px 0}
footer{margin-top:24px;font-size:12px;color:var(--mute);text-align:center}
footer a{color:var(--green-d)}
</style>

<body>
<div class="wrap">
  <header>
    <div class="logo">抹</div>
    <div class="brand"><b>鴨答角色取向表</b><span>把本命裝進一盒。11/11 活動用填表小工具</span></div>
    <a class="home" href="/">回抹茶屋 →</a>
  </header>

  <div class="layout">
    <section class="box stage">
      <div class="tabs" id="tabs"></div>
      <canvas id="cv" width="2160" height="2160"></canvas>
      <p class="tip">點格子選位置，再點右邊的角色放進去。電腦可以直接把角色或圖片檔拖進格子。<br>放好之後在格子上拖曳可以移動圖片，滾輪或右邊的滑桿可以放大。</p>
    </section>

    <aside class="side">
      <section class="box panel">
        <h2>這一格</h2>
        <div class="slotinfo" id="slotInfo"></div>
        <div id="slotCtl">
          <div class="field"><span>名字</span><input type="text" id="nameIn" maxlength="30" placeholder="角色名"></div>
          <div class="field"><span>放大</span><input type="range" id="zoomIn" min="1" max="4" step="0.01" value="1"></div>
          <div class="row">
            <button class="btn" id="fillAll" type="button">六格都放這位</button>
            <button class="btn" id="clearOne" type="button">清掉這格</button>
          </div>
        </div>
      </section>

      <section class="box panel">
        <div class="row" style="justify-content:space-between">
          <label class="chk"><input type="checkbox" id="showName" checked>圖上顯示名字</label>
          <button class="btn" id="clearAll" type="button">全部清空</button>
        </div>
        <div style="margin-top:10px"><button class="btn main big" id="exportBtn" type="button">匯出圖片</button></div>
      </section>

      <section class="box panel trayp">
        <h2>角色 <small>點一下放進選取的格子</small></h2>
        <div class="tray" id="tray">
          <h3>自己上傳</h3>
          <div class="grid" id="ownGrid">
            <label class="up" id="upLabel">＋<br>上傳圖片<input type="file" id="upFile" accept="image/*" multiple hidden></label>
          </div>
          <h3>抹茶的角色</h3>
          <div id="matchaArea"><div class="msg" id="matchaMsg">正在從抹茶屋抓角色圖……</div></div>
        </div>
      </section>
    </aside>
  </div>

  <footer>活動辦法以 <a href="https://www.threads.com/@caveduck_hant" target="_blank" rel="noopener">鴨答鴨答官方 Threads</a> 公告為準。發文記得加 #鴨答鴨答 #Caveduck</footer>
</div>

<input type="file" id="homeFile" accept=".html,text/html" hidden>

<dialog id="dlg">
  <img id="outImg" alt="完成的取向表">
  <p>手機可以長按圖片儲存。</p>
  <div class="row">
    <a class="btn main" id="dlLink" download="鴨答角色取向表.png" href="#">下載 PNG</a>
    <button class="btn" type="button" onclick="dlg.close()">關閉</button>
  </div>
</dialog>

const COLS = [491, 1080, 1670], ROWS = [598, 1302], BW = 520, BH = 566, RAD = 22;
const BOXES = ROWS.flatMap(y => COLS.map(cx => ({x: cx - BW/2, y, w: BW, h: BH})));

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const state = {tpl:'genre', sel:0, showName:true, slots:Array(6).fill(null)};
const tplImg = {};
const lib = new Map();   // id -> {id,name,src,img,own}
let uid = 0;

/* ===== 小工具 ===== */
function loadImg(src){
  return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
}
function shrink(im, max){
  const s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/webp', .9);
}
function videoFrame(src){
  return new Promise((ok, no) => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = src;
    const t = setTimeout(() => no('timeout'), 8000);
    v.addEventListener('loadeddata', () => { v.currentTime = Math.min(.5, (v.duration || 1) / 3); }, {once:true});
    v.addEventListener('seeked', () => {
      clearTimeout(t);
      const c = document.createElement('canvas');
      const s = Math.min(1, 1000 / Math.max(v.videoWidth, v.videoHeight));
      c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/webp', .9));
    }, {once:true});
    v.addEventListener('error', () => { clearTimeout(t); no('err'); }, {once:true});
  });
}
async function addItem({name, src, own}){
  let s = src;
  if (/^data:video|\.(mp4|webm|mov)(\?|$)/i.test(src)) s = await videoFrame(src);
  const img = await loadImg(s);
  const id = 'c' + (++uid);
  const item = {id, name, src:s, img, own};
  lib.set(id, item);
  return item;
}

/* ===== 畫 ===== */
function cover(sl, b){
  const im = sl.item.img, iw = im.naturalWidth, ih = im.naturalHeight;
  const sc = Math.max(b.w / iw, b.h / ih) * sl.zoom;
  const dw = iw * sc, dh = ih * sc;
  const mx = (dw - b.w) / 2, my = (dh - b.h) / 2;
  sl.ox = Math.max(-mx, Math.min(mx, sl.ox));
  sl.oy = Math.max(-my, Math.min(my, sl.oy));
  return {dw, dh, mx, my, x: b.x + (b.w - dw)/2 + sl.ox, y: b.y + (b.h - dh)/2 + sl.oy};
}
function rr(c, x, y, w, h, r){ c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
function drawName(c, name, b){
  if (!name) return;
  let fs = 46;
  c.font = `900 ${fs}px "Noto Sans TC", sans-serif`;
  const maxW = b.w - 56;
  while (c.measureText(name).width > maxW && fs > 22){ fs -= 2; c.font = `900 ${fs}px "Noto Sans TC", sans-serif`; }
  const tw = Math.min(c.measureText(name).width, maxW);
  const ph = fs + 22, pw = tw + 40;
  const px = b.x + (b.w - pw)/2, py = b.y + b.h - ph - 16;
  c.fillStyle = 'rgba(255,255,255,.94)';
  rr(c, px, py, pw, ph, ph/2); c.fill();
  c.lineWidth = 3; c.strokeStyle = '#111312'; c.stroke();
  c.fillStyle = '#111312'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(name, b.x + b.w/2, py + ph/2 + 1, maxW);
}
function render(c, forExport){
  c.fillStyle = '#fff'; c.fillRect(0, 0, 2160, 2160);
  const t = tplImg[state.tpl]; if (t) c.drawImage(t, 0, 0, 2160, 2160);
  BOXES.forEach((b, i) => {
    const sl = state.slots[i];
    if (sl){
      const g = cover(sl, b);
      c.save(); rr(c, b.x, b.y, b.w, b.h, RAD); c.clip();
      c.drawImage(sl.item.img, g.x, g.y, g.dw, g.dh);
      c.restore();
      if (state.showName) drawName(c, sl.name, b);
    } else if (!forExport){
      c.save(); c.setLineDash([18, 14]); c.lineWidth = 4; c.strokeStyle = '#bfc7c1';
      rr(c, b.x, b.y, b.w, b.h, RAD); c.stroke(); c.restore();
      c.fillStyle = '#a3aba5'; c.font = '500 40px "Noto Sans TC", sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(i === state.sel ? '點右邊的角色放進來' : '點這裡選位置', b.x + b.w/2, b.y + b.h/2);
    }
    if (!forExport && i === state.sel){
      c.save(); c.lineWidth = 10; c.strokeStyle = '#14a05c';
      rr(c, b.x - 8, b.y - 8, b.w + 16, b.h + 16, RAD + 6); c.stroke(); c.restore();
    }
  });
}
function draw(){ render(ctx, false); }

/* ===== 介面同步 ===== */
function syncPanel(){
  const sl = state.slots[state.sel];
  $('slotInfo').innerHTML = `第 ${state.sel + 1} 格　<b>${TPL[state.tpl].slots[state.sel]}</b>` + (sl ? '' : '　還沒放角色');
  ['nameIn','zoomIn','fillAll','clearOne'].forEach(id => $(id).disabled = !sl);
  $('nameIn').value = sl ? sl.name : '';
  $('zoomIn').value = sl ? sl.zoom : 1;
}
function renderTabs(){
  $('tabs').innerHTML = '';
  Object.entries(TPL).forEach(([k, t]) => {
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.textContent = t.label;
    b.setAttribute('aria-pressed', k === state.tpl);
    b.onclick = () => { state.tpl = k; renderTabs(); syncPanel(); draw(); };
    $('tabs').appendChild(b);
  });
}
function makeSlot(item){
  return {item, name:item.name, zoom:1, ox:0, oy:99999};  // oy 先給大值，cover() 會夾到最上緣，臉通常在上面
}
function place(i, item){
  state.slots[i] = makeSlot(item);
  const sl = state.slots[i], g = cover(sl, BOXES[i]);
  sl.oy = g.my * .55;
  const next = state.slots.findIndex((s, k) => !s && k > i);
  const any = state.slots.findIndex(s => !s);
  state.sel = next >= 0 ? next : (any >= 0 ? any : i);
  syncPanel(); draw();
}
function trayItem(item){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'it'; b.draggable = true; b.title = item.name;
  b.innerHTML = `<img alt=""><span></span>`;
  b.querySelector('img').src = item.src;
  b.querySelector('span').textContent = item.name;
  b.onclick = () => place(state.sel, item);
  b.addEventListener('dragstart', e => { e.dataTransfer.setData('text/x-oshi', item.id); e.dataTransfer.effectAllowed = 'copy'; });
  if (item.own){
    const d = document.createElement('span');
    d.className = 'del'; d.textContent = '✕'; d.title = '移除';
    d.onclick = e => {
      e.stopPropagation(); lib.delete(item.id); b.remove();
      state.slots = state.slots.map(s => s && s.item === item ? null : s); syncPanel(); draw();
    };
    b.appendChild(d);
  }
  return b;
}

/* ===== 上傳 ===== */
async function addFiles(files, slotIdx){
  let first = null;
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    const url = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(f); });
    try{
      const raw = await loadImg(url);
      const item = await addItem({name: f.name.replace(/\.[^.]+$/, '').slice(0, 20), src: shrink(raw, 1400), own:true});
      $('ownGrid').appendChild(trayItem(item));
      if (!first) first = item;
    }catch(e){}
  }
  if (first && slotIdx != null) place(slotIdx, first);
}
$('upFile').onchange = e => { addFiles([...e.target.files], null); e.target.value = ''; };

/* ===== 抓抹茶屋的角色 ===== */
function parseHome(html){
  const cards = [];
  const re = /\{\s*["']?id["']?\s*:\s*["']([^"']+)["']\s*,\s*["']?name["']?\s*:\s*["']([^"']+)["']/g;
  let m; while ((m = re.exec(html))) cards.push({id:m[1], name:m[2]});
  let imgs = {};
  const j = html.match(/<script[^>]*id=["']imgs["'][^>]*>([\s\S]*?)<\/script>/i);
  if (j){ try{ imgs = JSON.parse(j[1].trim() || '{}'); }catch(e){} }
  return {cards, imgs};
}
async function loadHome(html, sameSite){
  const {cards, imgs} = parseHome(html);
  const grid = document.createElement('div'); grid.className = 'grid';
  let n = 0;
  $('matchaMsg').textContent = `找到 ${cards.length} 張角色卡，圖片載入中……`;
  for (const c of cards){
    const cand = [];
    if (imgs[c.id]) cand.push(imgs[c.id]);
    if (sameSite) cand.push(`/room/img/${c.id}.webp`);
    for (const src of cand){
      try{ const item = await addItem({name:c.name, src, own:false}); grid.appendChild(trayItem(item)); n++; break; }catch(e){}
    }
  }
  const area = $('matchaArea'); area.innerHTML = '';
  if (n) area.appendChild(grid);
  else area.innerHTML = '<div class="msg">抹茶屋裡還沒有角色圖。</div>';
}
function showHomeFallback(){
  $('matchaArea').innerHTML = `<div class="msg">這裡連不到抹茶屋，角色圖抓不到。<br>把這頁放到 matchadev01.github.io 上就會自動載入。也可以直接選抹茶屋的 index.html 檔：<br><button class="btn" type="button" id="homeBtn">選抹茶屋 index.html</button></div>`;
  $('homeBtn').onclick = () => $('homeFile').click();
}
$('homeFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('matchaArea').innerHTML = '<div class="msg" id="matchaMsg">讀取中……</div>';
  loadHome(await f.text(), false);
};
async function initHome(){
  try{
    if (!/^https?:/.test(location.protocol)) throw 0;
    const r = await fetch('/', {cache:'no-cache'});
    if (!r.ok) throw 0;
    const html = await r.text();
    if (!/const\s+CARDS/.test(html)) throw 0;
    await loadHome(html, true);
  }catch(e){ showHomeFallback(); }
}

/* ===== 畫布互動 ===== */
function pt(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX - r.left) * 2160 / r.width, y:(e.clientY - r.top) * 2160 / r.height};
}
function hit(p){ return BOXES.findIndex(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h); }
let drag = null;
cv.addEventListener('pointerdown', e => {
  const p = pt(e), i = hit(p);
  if (i < 0) return;
  if (state.sel !== i){ state.sel = i; syncPanel(); draw(); }
  const sl = state.slots[i];
  if (sl){ drag = {i, p, ox:sl.ox, oy:sl.oy}; cv.setPointerCapture(e.pointerId); }
  else { const t = $('tray'); t.parentElement.classList.remove('hl'); void t.offsetWidth; t.parentElement.classList.add('hl');
    if (innerWidth <= 900) t.parentElement.scrollIntoView({behavior:'smooth', block:'nearest'}); }
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pt(e), sl = state.slots[drag.i];
  sl.ox = drag.ox + (p.x - drag.p.x); sl.oy = drag.oy + (p.y - drag.p.y); draw();
});
['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, () => drag = null));
cv.addEventListener('wheel', e => {
  const i = hit(pt(e)), sl = state.slots[i];
  if (!sl) return;
  e.preventDefault();
  sl.zoom = Math.max(1, Math.min(4, sl.zoom * (e.deltaY < 0 ? 1.06 : 1/1.06)));
  if (state.sel !== i) state.sel = i;
  syncPanel(); draw();
}, {passive:false});
cv.addEventListener('dragover', e => { e.preventDefault(); cv.classList.add('drag-over'); });
cv.addEventListener('dragleave', () => cv.classList.remove('drag-over'));
cv.addEventListener('drop', e => {
  e.preventDefault(); cv.classList.remove('drag-over');
  let i = hit(pt(e)); if (i < 0) i = state.sel;
  const id = e.dataTransfer.getData('text/x-oshi');
  if (id && lib.has(id)) { place(i, lib.get(id)); return; }
  if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files], i);
});

/* ===== 控制項 ===== */
$('nameIn').oninput = e => { const sl = state.slots[state.sel]; if (sl){ sl.name = e.target.value; draw(); } };
$('zoomIn').oninput = e => { const sl = state.slots[state.sel]; if (sl){ sl.zoom = +e.target.value; draw(); } };
$('clearOne').onclick = () => { state.slots[state.sel] = null; syncPanel(); draw(); };
$('clearAll').onclick = () => { if (confirm('六格都清掉？')){ state.slots = Array(6).fill(null); state.sel = 0; syncPanel(); draw(); } };
$('fillAll').onclick = () => {
  const src = state.slots[state.sel]; if (!src) return;
  state.slots = state.slots.map((s, i) => i === state.sel ? s : {...src});
  draw();
};
$('showName').onchange = e => { state.showName = e.target.checked; draw(); };
$('exportBtn').onclick = async () => {
  if (document.fonts) await document.fonts.ready;
  const c = document.createElement('canvas'); c.width = c.height = 2160;
  render(c.getContext('2d'), true);
  const url = c.toDataURL('image/png');
  $('outImg').src = url; $('dlLink').href = url;
  $('dlg').showModal();
};

/* ===== 開始 ===== */
(async () => {
  renderTabs(); syncPanel();
  await Promise.all(Object.entries(TPL).map(async ([k, t]) => { tplImg[k] = await loadImg(t.src); }));
  draw();
  if (document.fonts){
    document.fonts.load('900 46px "Noto Sans TC"', '取向表').then(draw).catch(() => {});
    document.fonts.load('500 40px "Noto Sans TC"', '點這裡選位置').then(draw).catch(() => {});
  }
  initHome();
})();
</script>
