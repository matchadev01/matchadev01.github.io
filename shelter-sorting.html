<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>第七收容所分類表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&family=LXGW+WenKai+TC&display=swap">
<style>
/* Layout: a cold institutional form sheet laid on a rain-dark night; one sheet, its contents swap per step */
:root{
  --night:#0a0e16;
  --night-2:#121a29;
  --paper:#dde0d9;
  --rule:#a9afa5;
  --ink:#1a2133;
  --ink-soft:#586072;
  --red:#a1272b;
  --navy:#1f2c5e;
  --steel:#2c3038;
  --steel-hi:#4a505b;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-hand:"LXGW WenKai TC","Kaiti TC",cursive;
  --w-bold:900;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--night);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.7;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:40px 56px;
  background-image:radial-gradient(ellipse at 50% -10%, var(--night-2), var(--night) 70%);
}
[dir=rtl] *{letter-spacing:0!important}
[dir=rtl] body{font-size:16px}
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.sheet{
  position:relative;z-index:1;
  max-width:640px;margin:0 auto;
  background:var(--paper);
  background-image:repeating-linear-gradient(0deg, transparent 0 31px, rgba(26,33,51,.05) 31px 32px);
  box-shadow:0 30px 80px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.08) inset;
  padding:44px clamp(18px,5vw,40px) 22px;
}
.sheet::before{ /* binder holes */
  content:"";position:absolute;inset-inline-start:10px;top:50%;width:10px;height:120px;transform:translateY(-50%);
  background:radial-gradient(circle, var(--night) 4px, transparent 5px) 0 0/10px 40px repeat-y;
  opacity:.85;
}

/* top controls */
.controls{position:absolute;top:10px;inset-inline-end:12px;display:flex;gap:6px;align-items:center}
.ctl{background:none;border:1px solid var(--rule);color:var(--ink-soft);font:inherit;font-family:var(--f-body);font-size:11px;letter-spacing:.08em;padding:2px 8px;cursor:pointer;height:24px}
.ctl:hover{color:var(--ink);border-color:var(--ink)}
.ctl:focus-visible{outline:2px solid var(--red);outline-offset:2px}
select.ctl{appearance:none;-webkit-appearance:none;padding-inline-end:20px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-size:4px 4px;background-repeat:no-repeat;background-position:calc(100% - 10px) 10px,calc(100% - 6px) 10px}
[dir=rtl] select.ctl{background-position:10px 10px,6px 10px}

/* header */
.head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:14px}
.head img{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.authority{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);line-height:1.5}
.head h1{font-family:var(--f-display);font-weight:var(--w-bold);font-size:clamp(20px,5vw,28px);line-height:1.25;margin:4px 0 0;letter-spacing:.04em;text-wrap:balance}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.meta div{padding-block:7px 6px;padding-inline:0 8px;font-size:12px;color:var(--ink-soft);min-width:0}
.meta div+div{border-inline-start:1px solid var(--rule);padding-inline-start:10px}
.meta b{display:block;font-weight:500;color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b.mono{font-family:var(--f-mono)}

.radio{margin-top:12px;background:var(--ink);color:var(--paper);font-size:12px;overflow:hidden;white-space:nowrap;padding:6px 0;position:relative}
.radio span{display:inline-block;padding-inline-start:100%;animation:ticker 40s linear infinite}
.radio::before{content:"FM 87.3";font-family:var(--f-mono);position:absolute;inset-inline-start:0;top:0;bottom:0;z-index:2;background:var(--red);color:#f3e9e2;padding:6px 10px;letter-spacing:.08em}
@keyframes ticker{to{transform:translateX(-100%)}}
[dir=rtl] .radio span{animation-name:tickerR}
@keyframes tickerR{to{transform:translateX(100%)}}

main{padding:22px 0 8px;min-height:320px}

/* intro */
.notice{font-size:15px;margin:0 0 14px}
.rules{border:1px solid var(--ink);padding:12px 14px;font-size:13px;color:var(--ink);background:rgba(255,255,255,.18);margin:0 0 22px}
.rules p{margin:0}
.rules p+p{margin-top:6px}
label.btn{display:inline-block}
.btn{
  font-family:var(--f-body);font-weight:700;font-size:15px;letter-spacing:.12em;
  background:var(--ink);color:var(--paper);border:0;padding:12px 26px;cursor:pointer;
  box-shadow:3px 3px 0 var(--red);
  transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--red)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--red)}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible,.bride-box:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.link{background:none;border:0;padding:4px 0;font:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* name field */
.namefield{display:grid;gap:6px;margin:0 0 22px;max-width:360px}
.namefield label{font-size:12px;letter-spacing:.1em;color:var(--ink-soft)}
.namefield label small{font-size:11px;margin-inline-start:.5em;color:#8d9389;letter-spacing:0}
.namefield input{font:inherit;font-size:17px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);padding:6px 2px;border-radius:0}
.namefield input::placeholder{color:#8d9389;font-size:13px}
.namefield input:focus{outline:none;border-bottom-color:var(--red)}
.nm-void{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--red);color:var(--ink-soft);margin-inline-end:.6em}
.nm-note{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px}
.nm-hand{font-family:var(--f-hand);font-size:22px;color:#16234d}

/* question */
.qno{font-size:12px;letter-spacing:.08em;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qtext{font-family:var(--f-display);font-weight:500;font-size:clamp(19px,4.6vw,22px);line-height:1.5;margin:6px 0 4px;text-wrap:balance}
.qnote{font-size:12px;color:var(--red);margin:0 0 10px}
.opts{display:grid;margin-top:14px;border-top:1px solid var(--rule)}
.opt{
  display:grid;grid-template-columns:22px 18px 1fr;gap:10px;align-items:start;
  text-align:start;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:12px 4px;font:inherit;color:var(--ink);cursor:pointer;
}
.opt:hover{background:rgba(26,33,51,.06)}
.opt .k{font-family:var(--f-mono);font-size:13px;color:var(--ink-soft);padding-top:2px}
.box{width:16px;height:16px;border:1.5px solid var(--ink);margin-top:5px;position:relative}
.opt.on .box::before,.opt.on .box::after,.bride-box.on::before,.bride-box.on::after{
  content:"";position:absolute;left:50%;top:50%;width:20px;height:2px;background:var(--navy);
}
.opt.on .box::before,.bride-box.on::before{transform:translate(-50%,-50%) rotate(45deg)}
.opt.on .box::after,.bride-box.on::after{transform:translate(-50%,-50%) rotate(-45deg)}
.qnav{margin-top:14px;min-height:28px}

/* processing */
.proc{font-size:14px;padding-top:30px}
.proc p{margin:0 0 8px;color:var(--ink-soft)}
.proc p.done{color:var(--ink)}
.proc p.done::after{content:"  " attr(data-done);color:var(--navy);font-size:12px}

/* bride field */
.footer-field{border-top:2px solid var(--ink);margin-top:10px;padding-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:12px;color:#8d9389}
.footer-field .lbl{text-decoration:line-through;text-decoration-color:rgba(141,147,137,.6)}
.bride-box{width:15px;height:15px;border:1.5px solid #9ea398;background:transparent;padding:0;cursor:pointer;position:relative;flex:none}
.bride-box.on{border-color:var(--ink)}
.bride-msg{color:var(--red);font-size:12px;min-height:1em}
.footnote{font-size:11px;color:var(--ink-soft);margin-top:8px;letter-spacing:.03em}

/* result */
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:6px}
.rhead span{font-size:12px;letter-spacing:.14em;color:var(--ink-soft)}
.rhead code{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:22px 0 18px}
.verdict.has-photo{grid-template-columns:auto 1fr 104px}
.stamp{
  --c:var(--red);
  border:4px double var(--c);color:var(--c);white-space:nowrap;
  font-family:var(--f-display);font-weight:var(--w-bold);font-size:40px;line-height:1.1;letter-spacing:.1em;
  padding-block:12px;padding-inline:18px 10px;transform:rotate(-7deg);
  mix-blend-mode:multiply;opacity:.9;
  animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both;
  -webkit-mask-image:radial-gradient(circle at 30% 40%, #000 60%, rgba(0,0,0,.75) 61%, #000 75%);
}
.stamp.latin{letter-spacing:.02em;padding-inline:12px}
@keyframes stampIn{from{transform:rotate(-7deg) scale(1.9);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:.9}}
.sub{font-family:var(--f-display);font-size:20px;font-weight:500;margin:0;line-height:1.35}
.subcap{font-size:12px;color:var(--ink-soft);letter-spacing:.1em}
.printed{border:1.5px solid var(--ink);min-width:120px;height:72px;padding:0 12px;position:relative;display:grid;place-items:center}
.printed::before{content:attr(data-label);position:absolute;inset-inline-start:6px;top:3px;font-size:10px;letter-spacing:.14em;color:var(--ink-soft)}
.hand{font-family:var(--f-hand);font-size:38px;color:#16234d;transform:rotate(-4deg);display:inline-block;animation:inkIn 1.2s ease both;white-space:nowrap}
@keyframes inkIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
[dir=rtl] .hand{animation-name:inkInR}
@keyframes inkInR{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
dl.fields{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:16px;border-top:1px solid var(--rule)}
dl.fields dt,dl.fields dd{margin:0;padding:10px 0;border-bottom:1px solid var(--rule)}
dl.fields dt{font-size:12px;letter-spacing:.1em;color:var(--ink-soft);padding-top:12px;min-width:56px;max-width:120px}
dl.fields dd{min-width:0}

.tagwrap{margin:26px 0 8px;display:grid;justify-items:center;gap:8px}
.tag{
  width:min(100%,380px);position:relative;
  background:linear-gradient(160deg,var(--steel-hi),var(--steel) 45%,#202329);
  color:#d7dbe2;border-radius:10px;
  padding-block:18px 16px;padding-inline:58px 18px;
  box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
  display:grid;grid-template-columns:1fr 64px;gap:12px;align-items:center;
}
.tag::before{content:"";position:absolute;inset-inline-start:18px;top:50%;width:20px;height:20px;border-radius:50%;transform:translateY(-50%);background:var(--paper);box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.tag .tno{font-family:var(--f-mono);font-weight:600;font-size:17px;letter-spacing:.08em;color:#eef1f5;min-height:1.3em}
.tag .tno.blank{border-bottom:1px dashed #8c929c;width:9em}
.tag .row{font-size:12px;color:#aab0ba;line-height:1.55}
.tag .row .k{margin-inline-end:.6em}
.tag .row b{color:#e6e9ee;font-weight:500}
.tag .emb{width:64px;height:64px;display:grid;place-items:center}
.tag .emb img{width:64px;height:64px;object-fit:contain}
.tag .emb svg{width:60px;height:60px}
.smudge{filter:blur(2.6px) saturate(.4) contrast(.85);opacity:.8;transform:rotate(9deg)}
.tagcap{font-size:11px;color:var(--ink-soft)}
.actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:18px}

/* photo step */
.ph-wrap{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:20px;align-items:start;margin-top:12px}
.frame{aspect-ratio:3/4;width:100%;max-width:100%;position:relative;background:#2a2f38;border:1.5px solid var(--ink);overflow:hidden;display:grid;place-items:center}
.frame::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(180deg, rgba(221,224,217,.45) 0 1px, transparent 1px 20px) left/14px 100% no-repeat,
    repeating-linear-gradient(180deg, rgba(221,224,217,.45) 0 1px, transparent 1px 20px) right/14px 100% no-repeat;
}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .empty{color:#8f96a3;font-size:12px;text-align:center;line-height:1.6;padding:12px}
.ph-side p{margin:0 0 10px;font-size:13px}
.ph-side .small{font-size:11px;color:var(--ink-soft)}
.ph-btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--ink);padding:10px 18px}
.btn.ghost:hover{transform:none;background:rgba(26,33,51,.06);box-shadow:none}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* photo on result */
.mug{width:104px;aspect-ratio:3/4;border:1px solid var(--ink);background:#2a2f38;transform:rotate(2.5deg);box-shadow:0 4px 10px rgba(0,0,0,.25);position:relative}
.mug img{width:100%;height:100%;object-fit:cover;display:block}
.mug::after{content:"";position:absolute;top:-10px;inset-inline-start:38px;width:14px;height:30px;border:2px solid #8b929d;border-radius:8px;border-bottom-color:transparent}
.cardout{margin-top:22px;display:grid;gap:8px;justify-items:center}
.cardout img{width:100%;max-width:440px;border:1px solid var(--rule);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cardout p{margin:0;font-size:12px;color:var(--ink-soft)}

@media (prefers-reduced-motion:reduce){
  .radio span{animation:none;padding-inline-start:110px}
  .stamp,.hand{animation:none}
}
@media (max-width:420px){
  .head{grid-template-columns:56px 1fr}
  .head img{width:56px;height:56px}
  .meta{grid-template-columns:1fr 1fr}
  .meta div:nth-child(3){grid-column:1/-1;border-inline-start:0;padding-inline-start:0;border-top:1px solid var(--rule)}
  .verdict,.verdict.has-photo{grid-template-columns:1fr;justify-items:start}
  .ph-wrap{grid-template-columns:1fr}
  .frame{max-width:240px}
  .stamp{font-size:34px}
  .tag{padding-inline-start:50px}
  .tag::before{inset-inline-start:14px}
}
</style>

</head>

    scrawl(total=1.2){ if(!ctx())return; let t=ac.currentTime+.05; const end=t+total; while(t<end){ const l=.05+Math.random()*.09; stroke(t,l,.16+Math.random()*.08); t+=l+.02+Math.random()*.06; } },
    paper(){ if(!ctx())return; const t=ac.currentTime; burst(t,.26,{type:'bandpass',f:1400,f2:700,q:.7,gain:.16,attack:.03}); burst(t+.05,.18,{type:'highpass',f:3500,gain:.06,attack:.02}); },
    key(t){ burst(t,.018,{type:'highpass',f:2200,gain:.32,attack:.001}); tone(t,.05,190,90,.18,'triangle'); },
    type(n=5){ if(!ctx())return; let t=ac.currentTime; for(let i=0;i<n;i++){ this.key(t); t+=.055+Math.random()*.05; } },
    bell(){ if(!ctx())return; const t=ac.currentTime; tone(t,.9,2093,null,.05); tone(t,.6,3140,null,.02); },
    stamp(){ if(!ctx())return; const t=ac.currentTime; tone(t,.22,95,38,.55); burst(t,.12,{type:'lowpass',f:500,gain:.5,attack:.002}); burst(t+.01,.06,{type:'bandpass',f:1800,q:.8,gain:.12,attack:.002}); },
    deny(){ if(!ctx())return; const t=ac.currentTime; tone(t,.09,140,120,.12,'square'); tone(t+.11,.12,120,100,.1,'square'); },
    shutter(){ if(!ctx())return; const t=ac.currentTime; burst(t,.03,{type:'highpass',f:1500,gain:.35,attack:.001}); tone(t,.04,320,150,.1,'triangle'); burst(t+.09,.05,{type:'highpass',f:1200,gain:.3,attack:.001}); }

})();

function pickLang(){
  const h = (location.hash||"").slice(1).toLowerCase();
  if(I18N[h]) return h;
  try{ const s=localStorage.getItem('tm07-lang'); if(s && I18N[s]) return s; }catch(e){}
  for(const l of (navigator.languages||[navigator.language||""])){
    const b=(l||"").toLowerCase();
    if(b.startsWith("zh")) return "zh";
    const k=b.slice(0,2); if(I18N[k]) return k;

}

function phMsg(text, err){ const e=$('phErr'); if(e){ e.textContent=text; e.style.color= err ? "var(--red)" : "var(--ink-soft)"; } }
let heicLib;
function loadHeicLib(){
  if(!heicLib) heicLib = new Promise((res,rej)=>{ const s=document.createElement('script'); s.src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"; s.onload=()=>res(window.heic2any); s.onerror=rej; document.head.appendChild(s); });

function loadPhoto(file){
  const U=P().ui;
  const isHeic = /heic|heif/i.test(file.type) || /\.(heic|heif)$/i.test(file.name||"");
  /* read as a data: URL; some hosts (Neocities among them) block blob: images */
  const show = blob => new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(blob);
  });
  phMsg(U.loading,false);
  show(file)
    .catch(()=> isHeic ? loadHeicLib().then(h=>h({blob:file,toType:"image/jpeg",quality:.9})).then(b=>show(Array.isArray(b)?b[0]:b)) : Promise.reject())
    .then(img => { photoImg = img; SFX.shutter(); photoStep(); })
    .catch(() => phMsg(isHeic ? U.heicErr : U.photoErr, true));
}

/* 3:4 registration photo; grey and cold for the shelter, warm and in colour for the bride */
function mugshot(img, bride){
  const L=P(), W=600,H=800, c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const s=Math.max(W/img.naturalWidth,H/img.naturalHeight);
  const dw=img.naturalWidth*s, dh=img.naturalHeight*s;
  x.drawImage(img,(W-dw)/2,(H-dh)/2.6,dw,dh);
  const d=x.getImageData(0,0,W,H), p=d.data;
  for(let i=0;i<p.length;i+=4){
    const r=p[i],g=p[i+1],b=p[i+2];
    if(!bride){ let y=.3*r+.59*g+.11*b; y=(y-128)*1.18+128; p[i]=y*.94; p[i+1]=y*.98; p[i+2]=y*1.06; }
    else { p[i]=Math.min(255,r*1.05+8); p[i+1]=Math.min(255,g+4); p[i+2]=b*.9; }
  }
  x.putImageData(d,0,0);
  const v=x.createRadialGradient(W/2,H*.42,H*.25,W/2,H/2,H*.75);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,bride?"rgba(60,35,10,.35)":"rgba(5,10,20,.5)");
  x.fillStyle=v; x.fillRect(0,0,W,H);
  if(!bride){
    x.strokeStyle="rgba(230,232,228,.75)"; x.fillStyle="rgba(230,232,228,.85)";
    x.font="600 15px 'IBM Plex Mono', monospace"; x.lineWidth=1.5;
    for(let k=0;k<=16;k++){
      const yy=40+k*40, long=k%2===0;
      x.beginPath(); x.moveTo(0,yy); x.lineTo(long?34:18,yy); x.moveTo(W,yy); x.lineTo(W-(long?34:18),yy); x.stroke();
      if(long) x.fillText(String(200-k*5),40,yy+5);
    }
    x.fillStyle="rgba(12,15,22,.88)"; x.fillRect(W*.14,H-118,W*.72,84);
    x.fillStyle="#e8ebe6"; x.textAlign="center"; x.direction=L.dir;
    x.font="600 30px 'IBM Plex Mono', monospace"; x.fillText(formNo,W/2,H-74);
    x.font=`500 17px ${L.font.body}`; x.fillText(L.ui.mugUnit+"   "+today(),W/2,H-46);
  }else{
    x.strokeStyle="rgba(180,143,60,.9)"; x.lineWidth=6; x.strokeRect(14,14,W-28,H-28);
    x.lineWidth=1.5; x.strokeRect(26,26,W-52,H-52);
  }
  return c.toDataURL('image/jpeg',.88);
}

/* ---------- scoring ---------- */
function score(){
  const tags = answers.map((j,i)=>TAGS[i][j]);
  const cat = {F:0,P:0,L:0}, sub = {}, last = {};
  tags.forEach((t,i)=>{ cat[t[0]]++; sub[t]=(sub[t]||0)+1; last[t]=i; last[t[0]]=i; });
  const top = Object.keys(cat).sort((a,b)=> cat[b]-cat[a] || (last[b]??-1)-(last[a]??-1))[0];
  return Object.keys(sub).filter(t=>t[0]===top).sort((a,b)=> sub[b]-sub[a] || last[b]-last[a])[0];
}

  const L=P(), U=L.ui, F=L.font, rtl=L.dir==="rtl", BW=boldW();

      document.fonts.load(`${BW} 50px ${F.display}`,sample), document.fonts.load(`500 40px ${F.display}`,sample),
      document.fonts.load(`400 26px ${F.body}`,sample), document.fonts.load(`500 26px ${F.body}`,sample),
      document.fonts.load(`600 22px ${mono}`,formNo), document.fonts.load(`90px ${F.hand}`,L.bride)
    ]).catch(()=>{}),
    new Promise(res=>setTimeout(res,3500))
  ]);
  const W=1080,H=2200, c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.direction = rtl ? "rtl" : "ltr";
  const PAPER="#dde0d9", INK="#1a2133", SOFT="#586072", RULE="#a9afa5";
  const fx=(x,w=0)=> rtl ? W-x-w : x;
  const text=(s,x,y,font,color,align="start")=>{ g.font=font; g.fillStyle=color; g.textAlign = align==="center" ? "center" : ((align==="start")===!rtl ? "left" : "right"); g.fillText(s,fx(x),y); };
  const rect=(x,y,w,h,color)=>{ g.fillStyle=color; g.fillRect(fx(x,w),y,w,h); };
  const spaced = s => /\s/.test(s) && !/[぀-ヿ㐀-鿿]/.test(s);
  const wrap=(s,maxW,font)=>{
    g.font=font; const lines=[]; let line="";
    const parts = spaced(s) ? s.split(/(\s+)/) : [...s];
    for(const p of parts){
      const t=line+p;
      if(g.measureText(t).width>maxW && line.trim()){ lines.push(line.trimEnd()); line=p.trimStart(); }
      else line=t;
    }
    if(line.trim()) lines.push(line.trim());
    return lines;
  };
  const para=(s,x,y,maxW,font,color,lh)=>{ const ls=wrap(s,maxW,font); ls.forEach((l,i)=>text(l,x,y+i*lh,font,color)); return y+(ls.length-1)*lh; };
  const fitSize=(s,maxW,base,min,fam,wt)=>{ let fs=base; g.font=`${wt} ${fs}px ${fam}`; while(fs>min && g.measureText(s).width>maxW){ fs-=2; g.font=`${wt} ${fs}px ${fam}`; } return fs; };

  g.fillStyle=PAPER; g.fillRect(0,0,W,H);
  g.fillStyle="rgba(26,33,51,.05)"; for(let y=31;y<H;y+=32) g.fillRect(0,y,W,1);
  const crest = await loadImg(CREST);
  if(crest) g.drawImage(crest,fx(70,130),58,130,130);

  // header
  const hx=225, hw=W-70-hx;
  let y = para(U.authority, hx, 96, hw, `400 22px ${F.body}`, SOFT, 32);
  let ts = 54, tf = `${BW} ${ts}px ${F.display}`, tl = wrap(U.title,hw,tf);
  if(tl.length>1){ ts=44; tf=`${BW} ${ts}px ${F.display}`; tl=wrap(U.title,hw,tf); }
  if(tl.length>2){ ts=36; tf=`${BW} ${ts}px ${F.display}`; tl=wrap(U.title,hw,tf); }
  y += ts + 14;
  tl.forEach((l,i)=>text(l,hx,y+i*Math.round(ts*1.18),tf,INK));
  y += (tl.length-1)*Math.round(ts*1.18);
  const ruleY = Math.max(214, y+34);
  rect(70,ruleY,W-140,3,INK);
  text(`${U.unitVal}   |   ${U.weather}${L.sep}${U.weatherVal}   |   ${today()}`,70,ruleY+44,`400 22px ${F.body}`,SOFT);
  text(r.bride?U.notFiled:formNo,W-70,ruleY+44,r.bride?`500 22px ${F.body}`:`600 22px ${mono}`,SOFT,"end");
  rect(70,ruleY+68,W-140,1,RULE);
  const top = ruleY+106;

  // photo
  const pw=360, ph=480;
  g.save(); g.translate(fx(70+pw/2),top+ph/2); g.rotate(rtl?0.012:-0.012);
  g.fillStyle="rgba(0,0,0,.18)"; g.fillRect(-pw/2+(rtl?-6:6),-ph/2+8,pw,ph);
  if(photoURL){ const pi=await loadImg(photoURL); if(pi) g.drawImage(pi,-pw/2,-ph/2,pw,ph); }
  else { g.fillStyle="#2a2f38"; g.fillRect(-pw/2,-ph/2,pw,ph); g.fillStyle="#8f96a3"; g.font=`400 26px ${F.body}`; g.textAlign="center"; g.fillText(U.noPhoto,0,10); }
  g.strokeStyle=INK; g.lineWidth=2; g.strokeRect(-pw/2,-ph/2,pw,ph); g.restore();

  // classification
  const rx=490, rw=W-70-rx;
  text(U.resultLabel,rx,top+25,`400 22px ${F.body}`,SOFT);
  if(!r.bride){
    const col=CAT_HEX[r.cat];
    g.save(); g.translate(fx(rx+170),top+150); g.rotate(-7*Math.PI/180); g.globalAlpha=.88;
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=7; g.strokeRect(-150,-75,300,150); g.lineWidth=3; g.strokeRect(-138,-63,276,126);
    const fs=fitSize(r.catName,246,104,36,F.display,BW);
    g.font=`${BW} ${fs}px ${F.display}`; g.textAlign="center"; g.textBaseline="middle"; g.fillText(r.catName,0,4); g.restore();
    let emb=null;
    if(r.emb==="crest") emb=crest;
    else emb = await loadImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(seal(r.emb,"#8a6b26")));
    if(emb) g.drawImage(emb,fx(890,120),top+10,120,120);
  }else{
    g.strokeStyle=INK; g.lineWidth=3; g.strokeRect(fx(rx,320),top+60,320,170);
    text(U.category,rx+12,top+88,`400 18px ${F.body}`,SOFT);
    const fs=fitSize(L.bride,280,90,40,F.hand,"normal");
    g.save(); g.translate(fx(rx+160),top+158); g.rotate(-4*Math.PI/180); g.fillStyle="#16234d"; g.font=`${fs}px ${F.hand}`; g.textAlign="center"; g.textBaseline="middle"; g.fillText(L.bride,0,0); g.restore();
    if(crest){
      const t=document.createElement('canvas'); t.width=22; t.height=22; t.getContext('2d').drawImage(crest,0,0,22,22);
      g.save(); g.globalAlpha=.75; g.imageSmoothingQuality="high"; g.translate(fx(950),top+80); g.rotate(.16); g.drawImage(t,-62,-62,124,124); g.restore();
    }
  }
  text(U.subLabel,rx,top+300,`400 22px ${F.body}`,SOFT);
  const subText = r.bride ? U.blank : r.sub;
  const sfs = fitSize(subText,rw,46,30,F.display,500);
  let sy = para(subText,rx,top+356,rw,`500 ${sfs}px ${F.display}`,r.bride?SOFT:INK,Math.round(sfs*1.2));
  text(U.guarantor,rx,sy+54,`400 22px ${F.body}`,SOFT);
  let gy = para(r.g,rx,sy+96,rw,`500 28px ${F.body}`,INK,40);

  // fields
  let fy = Math.max(top+ph+50, gy+40);
  rect(70,fy,W-140,1,RULE);
  const NI = nameInfo(r);
  const rows=[[U.nameRow,"__NAME__"],[U.dest,r.dest],[U.note,r.note]];
  if(r.move) rows.push([U.status,r.move]);
  rows.push([U.scent,r.scent]);
  g.font=`400 22px ${F.body}`;
  const lw = Math.min(260, Math.max(150, ...rows.map(([k])=>g.measureText(k).width+34)));
  for(const [k,v] of rows){
    text(k,70,fy+44,`400 22px ${F.body}`,SOFT);
    let ly;
    if(v==="__NAME__"){
      const vx=70+lw;
      if(NI.kind==="hand"){ text(NI.text,vx,fy+52,`44px ${F.hand}`,"#16234d"); ly=fy+52; }
      else if(NI.kind==="void"){
        const nf=`400 28px ${F.body}`; g.font=nf; const w=g.measureText(NI.text).width;
        text(NI.text,vx,fy+46,nf,SOFT);
        g.fillStyle="#a1272b"; g.fillRect(fx(vx-4,w+8),fy+37,w+8,3);
        text(NI.after,vx+w+24,fy+46,`600 26px ${mono}`,INK);
        ly=fy+46;
      }else{
        text(NI.text,vx,fy+46,`500 28px ${F.body}`,INK); ly=fy+46;
        if(NI.note){ text(NI.note,vx,fy+80,`400 20px ${F.body}`,SOFT); ly=fy+80; }
      }
    }else ly = para(v,70+lw,fy+46,W-140-lw,`400 28px ${F.body}`,INK,44);
    fy = ly+28; rect(70,fy,W-140,1,RULE);
  }
  const foot = fy+60;
  rect(70,foot,W-140,2,INK);
  para(U.footnote,70,foot+42,W-140-300,`400 20px ${F.body}`,SOFT,30);
  text("FM 87.3  THORNMOUTH",W-70,foot+42,`600 20px ${mono}`,SOFT,"end");
  const out=document.createElement('canvas'); out.width=W; out.height=Math.min(H,foot+100);
  out.getContext('2d').drawImage(c,0,0);
  return out.toDataURL('image/jpeg',.9);
}

function restart(){
  SFX.paper();
  brideClicks = 0; brideBox.classList.remove('on'); brideMsg.textContent = ""; photoImg = null; outcome = null; answers = [];
  newFormNo(); intro(); window.scrollTo({top:0});
}

let msgTimer;
brideBox.onclick = () => {
  if(brideBox.classList.contains('on')) return;
  const U=P().ui;
  brideClicks++;
  clearTimeout(msgTimer);
  if(brideClicks<3) SFX.deny();
  if(brideClicks===1) brideMsg.textContent = U.deny1;
  else if(brideClicks===2) brideMsg.textContent = U.deny2;
  else { brideMsg.textContent = ""; brideBox.classList.add('on'); SFX.pen(); return; }
  msgTimer = setTimeout(()=>brideMsg.textContent="", 1800);
};

/* rain */
const cv = $('rain'), cx = cv.getContext('2d');
let RW,RH,drops=[];
function size(){ RW=cv.width=innerWidth*devicePixelRatio; RH=cv.height=innerHeight*devicePixelRatio; drops = Array.from({length:Math.round(innerWidth/7)},()=>({x:Math.random()*RW,y:Math.random()*RH,l:(8+Math.random()*18)*devicePixelRatio,v:(9+Math.random()*9)*devicePixelRatio,a:.08+Math.random()*.18})); }
function draw(){
  cx.clearRect(0,0,RW,RH);
  for(const d of drops){
    cx.strokeStyle=`rgba(150,170,205,${d.a})`; cx.lineWidth=devicePixelRatio;
    cx.beginPath(); cx.moveTo(d.x,d.y); cx.lineTo(d.x-d.l*.18,d.y+d.l); cx.stroke();
    d.y+=d.v; d.x-=d.v*.18; if(d.y>RH){d.y=-d.l;d.x=Math.random()*RW*1.1;}
  }
}
size(); addEventListener('resize', size);
if(matchMedia('(prefers-reduced-motion: reduce)').matches) draw();
else (function loop(){ draw(); requestAnimationFrame(loop); })();

addEventListener('hashchange', ()=>{ const h=location.hash.slice(1).toLowerCase(); if(I18N[h] && h!==lang){ lang=h; applyLang(); rerender(); } });

newFormNo(); applyLang(); intro();
})();
</script>
