<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#2a1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Club MIRAGE">
<link rel="apple-touch-icon" href="icon192.png">
<link rel="manifest" href="manifest.json">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>色戀營業中 聖誕公關店 試玩</title>
<style>
/* 字型：jf open 粉圓（SIL OFL 1.1，授權見 assets/round-OFL.txt），子集化後依授權改名 MirageRound */
@font-face{font-family:"MirageRound";src:url("assets/round.woff2") format("woff2");font-display:swap}
:root{--ink:#5a3a46;--soft:#9b7380;--pink:#ff7aa8;--pinkd:#e0517f;--red:#d8344c;--wood:#e9b9a4;--woodd:#c98e7a;--paper:#fffaf6}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:"MirageRound","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body.pick{background:#fff0f0 radial-gradient(#ffd9e3 1.5px,transparent 1.6px) 0 0/22px 22px}
body.club{background:#2a1430 radial-gradient(#4a2352 1.5px,transparent 1.6px) 0 0/22px 22px}
main{max-width:1180px;margin:0 auto;padding:22px 12px 30px}
.screen{display:none}
body.pick #pick,body.club #clubscreen{display:block}
/* 選造型 */
.title{text-align:center;margin:0 0 44px}
.title h1{margin:0;font-size:30px;font-weight:400;letter-spacing:.12em;color:var(--red);text-shadow:2px 2px 0 #fff,4px 4px 0 #f7c6d3}
.title p{margin:8px 0 0;color:var(--soft);font-size:14px;letter-spacing:.2em}
.wardrobe{position:relative;background:var(--wood);border-radius:26px 26px 14px 14px;padding:18px;
  box-shadow:0 0 0 4px var(--woodd),0 10px 0 4px #b77c69,0 18px 30px rgba(150,80,90,.25)}
.wardrobe:before{content:"";position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:62%;height:30px;background:var(--wood);border-radius:20px 20px 0 0;box-shadow:0 0 0 4px var(--woodd)}
.wardrobe:after{content:"Club MIRAGE";position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:13px;letter-spacing:.3em;color:#fff;background:var(--pinkd);padding:3px 14px;border-radius:999px;white-space:nowrap}
.inner{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:16px}
.mirror{position:relative;background:linear-gradient(#fff7fb,#fde6ef 70%,#f9d8e4);border-radius:180px 180px 14px 14px;
  box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 10px #f3c3d2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:36px 16px 16px;min-height:600px}
.mirror:before{content:"";position:absolute;bottom:92px;left:50%;transform:translateX(-50%);width:66%;height:40px;border-radius:50%;background:radial-gradient(ellipse,#f2b8c9 0,#f7cfdb 55%,transparent 72%)}
#big{position:relative;height:470px;max-width:92%;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(255,255,255,.9));transition:opacity .15s}
.tag{position:relative;margin-top:12px;background:#fff;border-radius:12px;padding:8px 14px;font-size:14px;color:var(--soft);text-align:center;box-shadow:0 0 0 3px #f3c3d2;line-height:1.6;min-width:60%}
.tag b{color:var(--pinkd);font-weight:400;font-size:16px}
.closet{background:var(--paper);border-radius:14px;box-shadow:inset 0 0 0 4px #f6dccf;padding:14px;display:flex;flex-direction:column}
.closet h2{margin:2px 4px 8px;font-weight:400;font-size:17px;letter-spacing:.15em}
.rail{height:10px;border-radius:999px;background:linear-gradient(#e7c9a8,#c9a07c);margin:6px 6px 14px;box-shadow:0 2px 0 #b78a68}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,210px));justify-content:center;gap:18px 26px;align-content:start;flex:1}
.card{position:relative;font:inherit;border:0;background:none;padding:14px 0 0;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.card:before{content:"";position:absolute;top:0;left:50%;width:18px;height:16px;transform:translateX(-50%);border:3px solid #c9a07c;border-bottom:0;border-radius:10px 10px 0 0}
.card .pic{width:100%;aspect-ratio:1;background:#fff;border-radius:12px;box-shadow:0 0 0 3px #f3dcd2,0 4px 0 3px #f0d0c4;overflow:hidden;transition:transform .12s;position:relative}
.card .pic img{position:absolute;left:50%;top:6%;width:96%;transform:translateX(-50%)}
.card .nm{margin-top:8px;font-size:15px;line-height:1.3;text-align:center}
.card .tg{font-size:11px;color:var(--soft)}
.card:hover .pic{transform:translateY(-3px)}
.card.on .pic{box-shadow:0 0 0 3px var(--pink),0 4px 0 3px var(--pinkd);background:#fff5f8}
.card.on .nm{color:var(--pinkd)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-size:16px;border:0;border-radius:12px;padding:11px 22px;cursor:pointer}
.btn.main{background:var(--red);color:#fff;box-shadow:0 4px 0 #a8223a}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 0 0 3px #f3c3d2,0 4px 0 3px #e9b2c2}
.btn:active{transform:translateY(3px)}
/* 公關店 */
#clubscreen h1{margin:0 0 4px;text-align:center;font-weight:400;font-size:26px;letter-spacing:.14em;color:#ffd0e2;text-shadow:0 0 12px rgba(255,79,168,.7)}
#clubscreen .sub{margin:0 0 14px;text-align:center;color:#d9b8c6;font-size:13px;letter-spacing:.2em}
.stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 4px #e9b2c2,0 0 0 8px #5a2a4a,0 12px 30px rgba(0,0,0,.4)}
#club{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation}
#me{position:absolute;left:1.5%;bottom:3%;pointer-events:none;width:12%;aspect-ratio:3/4;background:rgba(255,246,240,.92);border-radius:12px;box-shadow:0 0 0 3px #e9b2c2;overflow:hidden}
#me img{position:absolute;left:50%;top:6%;width:120%;transform:translateX(-50%)}
#me span{position:absolute;left:0;right:0;bottom:0;background:#b8304c;color:#fff;font-size:clamp(10px,1.2vw,13px);text-align:center;padding:3px 0;letter-spacing:.1em}
#dlg{position:absolute;left:50%;bottom:3%;transform:translateX(-50%) translateY(14px);width:min(760px,92%);aspect-ratio:795/238;
  background:url("assets/ui_dialog.png") center/100% 100% no-repeat;opacity:0;pointer-events:none;transition:.18s;cursor:pointer}
#dlg.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#dname{position:absolute;left:9%;top:11%;width:29%;height:22%;display:flex;align-items:center;justify-content:center;color:#fff3ec;font-size:clamp(13px,2.2vw,20px);letter-spacing:.2em}
#dtext{position:absolute;left:5.5%;right:12%;top:40%;bottom:14%;font-size:clamp(13px,2vw,19px);line-height:1.55;color:var(--ink);overflow:hidden}
#dclose{position:absolute;right:3.5%;top:31%;width:5.5%;aspect-ratio:1;background:url("assets/ui_icon_close.png") center/contain no-repeat;border:0;cursor:pointer}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:#d9b8c6;font-size:13px;flex-wrap:wrap}
.tools label{display:flex;align-items:center;gap:6px}
.tools .btn{font-size:14px;padding:8px 16px}
@media (max-width:820px){
  .inner{grid-template-columns:1fr}
  .mirror{min-height:0;padding-top:28px}
  #big{height:340px}
  .items{grid-template-columns:repeat(4,1fr);gap:10px 8px;justify-content:stretch}
  .card .nm{font-size:12px}
  .title h1{font-size:24px}
}
@media (max-width:640px){
  body:not(.mland) #clubscreen h1{font-size:20px}
  body:not(.mland) .stage{overflow:visible}
  body:not(.mland) #dlg{position:relative;left:auto;bottom:auto;transform:none;width:100%;margin-top:14px;display:none;opacity:1}
  body:not(.mland) #dlg.show{display:block;transform:none}
  body:not(.mland) #dtext{font-size:14px}
  body:not(.mland) #dname{font-size:15px}
  body:not(.mland) #dclose{width:8%}
  body:not(.mland) #me{width:18%}
}

/* 密語收集 */
.passbar{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 12px;flex-wrap:wrap;color:#ffd0e2;font-size:13px;letter-spacing:.1em}
#pass{display:flex;gap:6px}
#pass .slot{width:34px;height:34px;display:grid;place-items:center;background:url("assets/ui_slot.png") center/100% 100%;color:#b8304c;font-size:18px}
#pass .slot.on{color:#fff;background:#ff7aa8;border-radius:8px;box-shadow:0 0 0 2px #fff3ec,0 0 10px #ff7aa8}
#passcount{color:#d9b8c6}
#passreset{font:inherit;font-size:12px;color:#d9b8c6;background:none;border:1px solid rgba(217,184,198,.4);border-radius:999px;padding:3px 10px;cursor:pointer}
#passdone{display:none;width:100%;text-align:center;color:#ffe08a;font-size:14px}
/* 回憶視窗 */
#mem{position:absolute;inset:0;background:rgba(20,6,26,.55);display:none;align-items:center;justify-content:center;z-index:5}
#mem.show{display:flex}
.memcard{position:relative;width:min(640px,88%);background:url("assets/ui_panel.png") center/100% 100% no-repeat;padding:11% 7% 5%;color:var(--ink);animation:memin .22s ease-out}
@keyframes memin{from{transform:translateY(12px) scale(.97);opacity:0}}
.memhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:2px dashed #e8c4cf;padding-bottom:8px;margin-bottom:10px}
#memtitle{font-size:clamp(16px,2.2vw,22px);color:#b8304c;letter-spacing:.12em}
#memowner{font-size:13px;color:var(--soft)}
.membody-wrap{display:flex;gap:16px;align-items:flex-start}
#memimgs{flex:0 0 32%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:#fff3f6;border-radius:12px;padding:10px;min-height:120px}
#memimgs img{max-width:100%;max-height:150px;object-fit:contain}
#memimgs img:not(:only-child){max-width:30%}
#membody{flex:1;font-size:clamp(13px,1.7vw,16px);line-height:1.75}
#membody p{margin:0 0 8px}
#membody .line b{color:#b8304c;font-weight:400;margin-right:4px}
.memfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
#memstep{display:flex;gap:6px}
#memstep i{width:10px;height:10px;border-radius:50%;background:#efd3dc}
#memstep i.on{background:#ff7aa8}
#memgift{display:none}
#memgift.show{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;border-radius:12px;background:linear-gradient(90deg,#fff1c9,#ffe0ec)}
#memgift .ch{width:42px;height:42px;display:grid;place-items:center;font-size:26px;color:#fff;background:#ff7aa8;border-radius:10px;box-shadow:0 0 0 3px #fff,0 0 12px #ff7aa8}
#memgift.pop .ch{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}100%{transform:none}}
#memgift .t{font-size:14px;color:#9a4a62}
#membtn{font:inherit;font-size:15px;color:#fff;background:linear-gradient(#ffc9d6,#f59ab4);border:3px solid #f6d08f;border-radius:999px;box-shadow:0 0 0 2px #5a2a36,inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(200,80,120,.35);text-shadow:0 1px 0 #c0496e,0 0 3px #c0496e;padding:8px 26px;cursor:pointer;min-width:120px}
#memclose{position:absolute;right:3.5%;top:8%;width:30px;height:30px;background:url("assets/ui_icon_close.png") center/contain no-repeat;border:0;cursor:pointer}
@media (max-width:640px){
  body:not(.mland) #mem{position:fixed;z-index:50;overflow-y:auto}
  body:not(.mland) .memcard{width:96%;background:none;border-style:solid;border-width:60px 46px 46px;border-image:url("assets/ui_panel.png") 112 92 84 fill / 60px 46px 46px stretch;padding:2px 0 0}
  body:not(.mland) #memclose{top:-46px;right:-34px;width:26px;height:26px}
  body:not(.mland) .membody-wrap{flex-direction:column;align-items:stretch}
  body:not(.mland) #memimgs{flex:none;min-height:0}
  body:not(.mland) #memimgs img{max-height:110px}
  body:not(.mland) #pass .slot{width:28px;height:28px;font-size:15px}
}
#cgpause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:3}
#cgpause.show{display:flex}
.cgbox{background:#fff8f4;border-radius:18px;padding:22px 34px;box-shadow:0 0 0 4px #e9b2c2,0 8px 0 4px #c98ea0;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:220px}
.cgbox h3{margin:0 0 4px;font-weight:400;font-size:24px;color:#b8304c;letter-spacing:.2em}
.cgbox button{font:inherit;font-size:17px;width:100%;color:#fff;background:linear-gradient(#ffc9d6,#f59ab4);border:3px solid #f6d08f;border-radius:999px;box-shadow:0 0 0 2px #5a2a36,inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(200,80,120,.35);text-shadow:0 1px 0 #c0496e,0 0 3px #c0496e;padding:8px 0;cursor:pointer}
.cgbox button:active,#membtn:active,#cgagain:active{transform:translateY(2px)}
.cgbox p{margin:4px 0 0;font-size:12px;color:#c48a9c}
.vol{display:flex;align-items:center;gap:8px}
.vol input{width:110px;accent-color:#ff7aa8}
.cgbox .vol{font-size:13px;color:#9b7380;margin-top:4px}
/* 香檳塔小遊戲 */
#cg{position:absolute;inset:0;background:#2a1032;display:none;z-index:8}
#cg.show{display:block}
#cgcv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
#cgtop{position:absolute;top:2%;right:1.5%;display:flex;gap:8px;z-index:4}
#cgtop button{font:inherit;font-size:14px;color:#5a3a46;background:#fff6f8;border:0;border-radius:999px;padding:6px 14px;box-shadow:0 0 0 2px #e9b2c2,0 3px 0 2px #c98ea0;cursor:pointer}
#cgagain{position:absolute;left:50%;top:66%;transform:translateX(-50%);z-index:2;font:inherit;font-size:17px;color:#fff;background:linear-gradient(#ffc9d6,#f59ab4);border:3px solid #f6d08f;border-radius:999px;box-shadow:0 0 0 2px #5a2a36,inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(200,80,120,.35);text-shadow:0 1px 0 #c0496e,0 0 3px #c0496e;padding:9px 34px;cursor:pointer}
#cgagain:active{transform:translate(-50%,2px)}
#cgmenu{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:1;padding:4%}
#cgmenu.show{display:flex}
#cgmenu h2{margin:0;font-weight:400;font-size:clamp(20px,3vw,30px);color:#ffd0e2;letter-spacing:.15em;text-shadow:0 0 12px rgba(255,79,168,.7)}
#cgmenu p{margin:0;color:#d9b8c6;font-size:13px}
.cgopts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
.cgopt{font:inherit;width:min(250px,30%);min-width:170px;text-align:left;background:#fff8f4;color:#5a3a46;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:0 0 0 3px #e9b2c2,0 5px 0 3px #c98ea0;transition:transform .12s}
.cgopt:hover{transform:translateY(-3px)}
.cgopt b{display:block;font-weight:400;font-size:19px;color:#b8304c;margin-bottom:6px}
.cgopt span{display:block;font-size:13px;line-height:1.6}
.cgopt i{display:block;font-style:normal;font-size:12px;color:#c48a9c;margin-top:6px;min-height:1em}
@media (max-width:640px){
  body:not(.mland) #cg{position:fixed;z-index:60;display:none;align-items:center;justify-content:center;background:#1a0820}
  body:not(.mland) #cg.show{display:flex}
  body:not(.mland) #cgcv{height:auto;aspect-ratio:3/2}
  body:not(.mland) #cgmenu{position:fixed;overflow-y:auto;justify-content:flex-start;padding-top:60px;background:#2a1032}
  body:not(.mland) .cgopt{width:100%}
}

/* 手機橫向（mland）：店裡畫面塞進一個螢幕高，小遊戲全螢幕。--lw、--lh 是橫向畫面的寬高，強制橫向時會對調 */
body.mland{overflow:hidden;overscroll-behavior:none}
body.forceland main{position:fixed;top:0;left:0;width:var(--lw);height:var(--lh);max-width:none;margin:0;transform-origin:0 0;transform:translateX(var(--lh)) rotate(90deg);overflow:hidden}
  body.mland main{padding:4px 8px 10px}
  body.mland #clubscreen h1,body.mland #clubscreen>.sub{display:none}
  body.mland .passbar{margin:0 0 4px;gap:8px;font-size:11px}
  body.mland #pass{gap:3px}
  body.mland #pass .slot{width:22px;height:22px;font-size:13px}
  body.mland #passreset{font-size:11px;padding:1px 8px}
  body.mland .stage{width:min(100%,calc((var(--lh) - 44px)*1.5));margin:0 auto}
  body.mland .tools{margin-top:6px;font-size:11px}
  body.mland .tools>span:first-child{display:none}
  body.mland .tools .btn{font-size:12px;padding:5px 12px}
  body.mland #cg{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:#1a0820}
  body.mland #cg.show{display:flex}
  body.mland #cgcv{width:min(var(--lw),calc(var(--lh)*1.5));height:auto;aspect-ratio:3/2}
  body.mland #cgmenu{position:fixed;padding:8px 12px;gap:8px;background:#2a1032}
  body.mland #cgmenu h2{font-size:20px}
  body.mland .cgopts{gap:10px;flex-wrap:nowrap}
  body.mland .cgopt{width:31%;min-width:0;padding:10px 12px}
  body.mland .cgopt b{font-size:16px;margin-bottom:3px}
  body.mland .cgopt span{font-size:12px;line-height:1.45}
  body.mland #cgtop button{font-size:12px;padding:4px 10px}
  body.mland .cgbox{padding:14px 24px;gap:7px}
  body.mland .cgbox h3{font-size:19px}
  body.mland .cgbox button{font-size:14px;padding:7px 0}
  body.mland #mem{position:fixed;z-index:50;overflow-y:auto}
  body.mland .memcard{width:min(560px,80%);padding:7% 5% 3%}
  body.mland #membody{font-size:13px;line-height:1.6}
  body.mland #memimgs img{max-height:90px}

/* 手機直拿時，店裡和小遊戲整個轉成橫向顯示（forceland） */

/* ===== 手機橫向版面（mland）：選造型與店裡都塞滿一個畫面 ===== */
body.club,body.mland{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.mland main{width:var(--lw);height:var(--lh);max-width:none;padding:0;margin:0}
body.mland:not(.forceland) main{position:fixed;inset:0}
/* 選造型：左邊鏡子、右邊衣櫃，一個畫面放得下 */
body.mland .title{display:none}
body.mland #pick{height:100%;padding:8px 10px}
body.mland .wardrobe{height:100%;padding:8px;border-radius:16px}
body.mland .wardrobe:before,body.mland .wardrobe:after{display:none}
body.mland .inner{height:100%;grid-template-columns:38% 1fr;gap:8px}
body.mland .mirror{min-height:0;height:100%;padding:10px 8px 8px;border-radius:120px 120px 10px 10px}
body.mland .mirror:before{bottom:56px;height:24px}
body.mland #big{height:calc(var(--lh) - 110px);max-height:none}
body.mland .tag{margin-top:4px;padding:3px 10px;font-size:11px;line-height:1.4}.tag b{font-size:13px}
body.mland .closet{padding:8px 10px;min-height:0;overflow:hidden}
body.mland .closet h2{font-size:14px;margin:0 4px 2px}
body.mland .rail{margin:2px 6px 6px}
body.mland .items{grid-template-columns:repeat(4,1fr);gap:6px 8px;justify-content:stretch;overflow-y:auto;min-height:0}
body.mland .card{padding-top:10px}
body.mland .card .pic{aspect-ratio:1/1.05}
body.mland .card .nm{font-size:11px;margin-top:4px}
body.mland .card .tg{font-size:10px}
body.mland .actions{margin-top:6px}
body.mland #go{padding:9px 22px;font-size:15px}
/* 店裡：地圖撐滿整個高度，密語列和設定浮在地圖上 */
body.mland #clubscreen{height:100%;position:relative}
body.mland .stage{width:min(100%,calc(var(--lh)*1.5));margin:0 auto}
body.mland .passbar{position:absolute;z-index:7;top:6px;left:max(6px,calc(50% - var(--lh)*.75 + 6px));margin:0;padding:3px 8px;background:rgba(26,8,32,.72);border-radius:12px;font-size:11px;flex-wrap:nowrap}
body.mland .passbar>span:first-child{display:none}
body.mland #passdone{position:absolute;top:100%;left:0;width:max-content;font-size:11px}
#toolbtn{display:none}
body.mland #toolbtn{display:block;position:absolute;z-index:7;top:6px;right:max(6px,calc(50% - var(--lh)*.75 + 6px));font:inherit;font-size:13px;color:#5a3a46;background:#fff6f8;border:0;border-radius:999px;padding:8px 14px;box-shadow:0 0 0 2px #e9b2c2,0 3px 0 2px #c98ea0}
body.mland .tools{display:none;position:absolute;z-index:8;top:48px;right:max(6px,calc(50% - var(--lh)*.75 + 6px));margin:0;flex-direction:column;align-items:stretch;gap:10px;background:#fff8f4;color:#5a3a46;border-radius:14px;padding:12px 14px;box-shadow:0 0 0 3px #e9b2c2,0 5px 0 3px #c98ea0;font-size:13px}
body.mland .tools.open{display:flex}
body.mland .tools>span:first-child{display:none}
body.mland .tools>span{flex-direction:column;align-items:stretch!important;gap:10px!important}
body.mland .tools .btn{font-size:13px;padding:8px 14px;color:#7a2048}
#fsbtn{display:none}
body.mland #fsbtn.can{display:block}
body.mland .card .nm{margin-top:10px}
body.mland #dlg{width:72%;bottom:2%}
body.mland #dtext{font-size:clamp(11px,calc(var(--lh)*.034),13px);overflow-y:auto;line-height:1.45;top:39%;bottom:11%}
body.mland #dname{font-size:14px}
body.mland #me{width:10%}
/* 小遊戲：撐滿畫面，按鈕加大方便手指點 */
body.mland #cgcv{width:min(var(--lw),calc(var(--lh)*1.5))}
body.mland #cgtop button{font-size:13px;padding:8px 14px}
body.mland #cgagain{padding:12px 34px;font-size:16px}

/* ===== 手機按鈕瘦身：圖示化，地圖兩側有空白（gutter）就移到空白處，避免擋畫面 ===== */
#cgtop svg,#toolbtn svg{display:none;width:20px;height:20px;fill:currentColor}
body.mland #cgtop button,body.mland #toolbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:40px;height:40px;padding:0;border-radius:50%;
  background:rgba(255,246,248,.82);color:#7a2048;box-shadow:0 0 0 2px rgba(233,178,194,.9);font-size:0}
body.mland #cgtop svg,body.mland #toolbtn svg{display:block}
body.mland #cgtop{top:6px;right:6px;gap:6px}
body.mland #toolbtn{position:absolute;z-index:7;top:auto;bottom:6px;right:max(6px,calc(50% - var(--lh)*.75 + 6px));opacity:.85}
body.mland .tools{top:auto;bottom:52px}
/* 兩側空白夠寬：按鈕和小標籤放到空白處 */
body.gutter #cgtop{flex-direction:column;top:10px;right:calc((var(--gut) - 52px)/2);gap:10px}
body.gutter #cgtop button,body.gutter #toolbtn{width:52px;height:52px;font-size:10px;letter-spacing:0;background:rgba(255,246,248,.12);color:#ffd0e2;box-shadow:0 0 0 1.5px rgba(255,208,226,.55);opacity:1}
body.gutter #cgtop span,body.gutter #toolbtn span{display:block;line-height:1}
body.gutter #toolbtn{top:10px;bottom:auto;right:calc((var(--gut) - 52px)/2)}
body.gutter .tools{top:10px;bottom:auto;right:calc(var(--gut) + 6px)}
body.gutter .stage{overflow:visible}
body.gutter .passbar{top:0;left:0;bottom:0;width:var(--gut);padding:10px 4px;flex-direction:column;justify-content:flex-start;gap:6px;background:none;border-radius:0}
body.gutter #pass{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
body.gutter #pass .slot{width:min(22px,calc((var(--gut) - 22px)/3));height:min(22px,calc((var(--gut) - 22px)/3));font-size:12px}
body.gutter #passcount{font-size:11px}
body.gutter #passreset{font-size:11px;padding:2px 10px}
body.gutter #passdone{position:static;width:100%;font-size:10px;line-height:1.4;letter-spacing:0}
body.gutter #me{left:calc(-1 * var(--gut) + (var(--gut) - min(var(--gut) - 14px,86px))/2);bottom:8px;width:min(calc(var(--gut) - 14px),86px)}
body.gutter #me span{font-size:10px;letter-spacing:0}

/* 香檳 call 按鍵設定 */
#cgkeys{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;background:rgba(20,4,24,.45)}
#cgkeys.show{display:flex}
#cgkeys .krow{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%}
#cgkeys .krow span{font-size:18px;min-width:3em}
#cgkeys .krow button{width:auto;min-width:130px;background:#fff;color:#7a2048;border-radius:10px;box-shadow:0 0 0 2px #e9b2c2;font-size:18px;padding:8px 14px}
#cgkeys .krow button.wait{background:#ffe08a;box-shadow:0 0 0 3px #e0a020}
#cgkeys .khelp{font-size:12px;color:#9b7380;max-width:260px;text-align:center;line-height:1.5}
#cgkeys .ksub{background:none;color:#b8304c;box-shadow:0 0 0 1.5px #e9b2c2;border:0;text-shadow:none;border-radius:999px;font-size:13px;padding:6px 0}
.cglink{font:inherit;font-size:13px;color:#ffd0e2;background:none;border:1px solid rgba(255,208,226,.5);border-radius:999px;padding:6px 16px;cursor:pointer}
@media (pointer:coarse){.pconly{display:none!important}}

/* 香檳 call 難度選擇 */
#cgdiff{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;background:rgba(20,4,24,.45)}
#cgdiff.show{display:flex}
#cgdiff .cgbox{min-width:300px}
#cgdiff [data-d]{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;line-height:1.2}
#cgdiff [data-d] small{font-size:12px;opacity:.92;padding:0 14px}
#cgdiff [data-d] i{font-style:normal;font-size:11px;opacity:.9}
#cgdiff [data-d] i:empty{display:none}
#cgdiff [data-d].last{box-shadow:0 0 0 2px #5a2a36,0 0 0 5px #ffe08a,inset 0 2px 0 rgba(255,255,255,.65)}
#cgdiff .ksub{background:none;color:#b8304c;box-shadow:0 0 0 1.5px #e9b2c2;border:0;border-radius:999px;font-size:13px;padding:6px 0;text-shadow:none}
body.mland #cgdiff .cgbox{padding:12px 22px;gap:6px}
body.mland #cgdiff [data-d]{padding:5px 0}
</style>

<body class="pick"><main>
  <section class="screen" id="pick">
    <div class="title">
      <h1>聖誕更衣室</h1>
      <p>派對開始前，挑一套今晚的造型</p>
    </div>
    <div class="wardrobe">
      <div class="inner">
        <div class="mirror">
          <img id="big" alt="">
          <div class="tag">今晚的造型<br><b id="bigname"></b></div>
        </div>
        <div class="closet">
          <h2>造型</h2>
          <div class="rail"></div>

          <div class="actions">
            <button class="btn main" id="go">就穿這套進場</button>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="screen" id="clubscreen">
    <h1>Club MIRAGE 聖誕之夜</h1>
    <p class="sub">點閃閃發光的地方，看看大家的回憶</p>
    <div class="passbar"><span>密語</span><div id="pass"></div><span id="passcount"></span><button id="passreset">重來</button>
      <div id="passdone">密語收集完成！把這句話留言到活動貼文就能參加抽獎。</div></div>
    <div class="stage">
      <canvas id="club" width="1536" height="1024"></canvas>
      <div id="me"><img alt="" id="meimg"><span>今晚的妳</span></div>
      <div id="mem"><div class="memcard">
        <button id="memclose" aria-label="關閉"></button>
        <div class="memhead"><span id="memtitle"></span><span id="memowner"></span></div>
        <div class="membody-wrap"><div id="memimgs"></div><div id="membody"></div></div>
        <div id="memgift"></div>
        <div class="memfoot"><div id="memstep"></div><button id="membtn">再來看看</button></div>
      </div></div>
      <div id="cg">
        <canvas id="cgcv" width="960" height="640"></canvas>
        <div id="cgtop"><button id="cgpausebtn" style="display:none"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>暫停</span></button><button id="cgswap" style="display:none"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>換一個玩</span></button><button id="cgclose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span>回到店裡</span></button></div>
        <button id="cgagain" style="display:none">再玩一次</button>
        <div id="cgdiff"><div class="cgbox"><h3>香檳 call</h3><p class="khelp">選一個難度</p>
          <button data-d="easy">簡單<small>每小節一兩顆，圈圈縮得比較慢</small><i></i></button>

          <button data-d="hard">困難<small>跟著每一下鼓聲</small><i></i></button>
          <button id="cgdiffback" class="ksub">回選單</button></div></div>
        <div id="cgkeys"><div class="cgbox"><h3>按鍵設定</h3><p class="khelp">點角色旁邊的按鈕，再按想用的鍵</p>
          <div class="krow"><span style="color:#d9a520">牡丹</span><button data-k="0"></button></div>
          <div class="krow"><span style="color:#6f8fd8">蓮</span><button data-k="1"></button></div>
          <div class="krow"><span style="color:#e0679a">真央</span><button data-k="2"></button></div>
          <p class="khelp">有路的圈圈：按住同一個鍵到杯子跑完。滑鼠點圈圈、按住也可以。</p>
          <button id="cgkeyreset" class="ksub">恢復預設 D F J</button><button id="cgkeyok">好了</button></div></div>
        <div id="cgpause"><div class="cgbox"><h3>暫停中</h3><button id="cgresume">繼續</button><button id="cgrestart">重新開始</button><button id="cgquit">換一個玩</button><button class="cgkeysbtn pconly">按鍵設定</button><label class="vol">音樂音量<input type="range" class="musicvol" min="0" max="100" step="5"></label><p>電腦也可以按 Esc 或 P 暫停、繼續</p></div></div>
        <div id="cgmenu">
          <h2>香檳塔</h2>
          <p>選一個玩吧</p>
          <div class="cgopts">
            <button class="cgopt" data-g="pour"><b>倒香檳</b><span>按住倒酒，酒到金線就放手。一共五層，倒得越準，香檳 call 越熱鬧。</span><i data-best="pour"></i></button>
            <button class="cgopt" data-g="stack"><b>疊香檳塔</b><span>杯子會左右跑，點一下放下去。沒疊到的會往下掉，卡進空位也算，掉出檯子才會碎。</span><i data-best="stack"></i></button>
            <button class="cgopt" data-g="osu"><b>香檳 call</b><span>誰在喊，圈圈就出現在誰旁邊，金框縮到剛好就點。有路的圈圈：手機自己沿路滑，電腦按住到終點。會有聲音。</span><i data-best="osu"></i></button>
          </div>
          <button class="cgkeysbtn pconly cglink">香檳 call 按鍵設定</button>
        </div>
      </div>
      <div id="dlg"><div id="dname"></div><div id="dtext"></div><button id="dclose" aria-label="關閉"></button></div>
    </div>
    <button id="toolbtn" aria-label="設定"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8 4.6v-2.2l-2.3-.5a6 6 0 0 0-.6-1.4l1.3-2-1.6-1.6-2 1.3a6 6 0 0 0-1.4-.6L13.1 4h-2.2l-.5 2.3a6 6 0 0 0-1.4.6l-2-1.3-1.6 1.6 1.3 2a6 6 0 0 0-.6 1.4L4 10.9v2.2l2.3.5c.1.5.3 1 .6 1.4l-1.3 2 1.6 1.6 2-1.3c.4.3.9.5 1.4.6l.5 2.3h2.2l.5-2.3c.5-.1 1-.3 1.4-.6l2 1.3 1.6-1.6-1.3-2c.3-.4.5-.9.6-1.4z"/></svg><span>設定</span></button>
    <div class="tools">
      <span>點對話框看下一句。之後可以點牡丹、蓮、真央聊天，點有閃光的物件看回憶，每個物件可以點三次。</span>
      <span style="display:flex;gap:12px;align-items:center">
        <label class="vol">音樂音量<input type="range" class="musicvol" min="0" max="100" step="5"></label>
        <label><input type="checkbox" id="dbg">顯示可走範圍</label>
        <button class="btn sub" id="fsbtn">全螢幕</button>

<script src="sfx.js?v=11260048"></script>

<script src="champagne.js?v=11260048"></script>
<script>
(()=>{
  let cur=0;
  const items=document.getElementById('items'),big=document.getElementById('big'),bn=document.getElementById('bigname');
  LOOKS.forEach((l,i)=>{
    const b=document.createElement('button');b.className='card';
    b.innerHTML=`<div class="pic"><img alt="" src="assets/${l.id}.webp"></div><span class="nm">${l.name}</span><span class="tg">${l.tag}</span>`;
    b.onclick=()=>pick(i);items.appendChild(b);
  });
  function pick(i){cur=i;[...items.children].forEach((c,k)=>c.classList.toggle('on',k===i));
    big.style.opacity=0;setTimeout(()=>{big.src=`assets/${LOOKS[i].id}.webp`;big.onload=()=>big.style.opacity=1},120);bn.textContent=LOOKS[i].name}
  pick(0);
  // 店裡的背景音樂：進場時開始播，玩小遊戲時暫停
  // 音樂音量拉桿（店內 BGM 和香檳 call 的歌共用），小遊戲裡店內 BGM 自動降到一半以下
  const bgm=new Audio('assets/bgm_sleigh.mp3');bgm.loop=true;
  let vol=1,duck=false;try{const s=localStorage.getItem('mirage_xmas_bgm_vol2');if(s!=null)vol=+s}catch(e){}
  const apply=()=>{bgm.volume=Math.min(1,vol*(duck?.45:1));document.querySelectorAll('.musicvol').forEach(r=>r.value=Math.round(vol*100));
    if(vol<=0)bgm.pause();window.dispatchEvent(new Event('musicvol'))};
  const tryPlay=()=>{if(vol>0&&document.body.classList.contains('club')){const p=bgm.play();if(p)p.catch(()=>{})}};
  window.BGM={pause:()=>bgm.pause(),resume:tryPlay,el:bgm,vol:()=>vol,duck:v=>{duck=v;apply()}};
  document.querySelectorAll('.musicvol').forEach(r=>r.oninput=()=>{const was=vol;vol=r.value/100;try{localStorage.setItem('mirage_xmas_bgm_vol2',vol)}catch(e){}apply();if(was<=0&&vol>0&&!(window.CG&&CG.rhythm&&CG.rhythm()))tryPlay()});
  apply();
  document.getElementById('go').onclick=()=>{
    setScreen('club');tryPlay();
    document.getElementById('meimg').src=`assets/${LOOKS[cur].id}.webp`;
    setTimeout(()=>CLUB.enter(LOOKS[cur]),400);
  };
  window.addEventListener('click',e=>{if(performance.now()<(window.__ghostUntil||0)&&e.target.id!=='club'){e.stopPropagation();e.preventDefault()}},true);
  document.getElementById('back').onclick=()=>{setScreen('pick');bgm.pause()};
  // 手機：橫拿用 mland 版面；直拿進店裡時把整個畫面轉 90 度，強制橫向（forceland）
  function layout(){const b=document.body,phone=matchMedia('(pointer:coarse)').matches&&Math.min(innerWidth,innerHeight)<=520,
    port=innerHeight>innerWidth,club=b.classList.contains('club');
    b.classList.toggle('mland',phone);b.classList.toggle('forceland',phone&&port);
    // --lw、--lh：橫向畫面的實際可見寬高（用 innerWidth/innerHeight，避開網址列造成的 100vh 誤差），強制橫向時對調
    const w=innerWidth,h=innerHeight,s=b.style,LW=phone&&port?h:w,LH=phone&&port?w:h;s.setProperty('--lw',LW+'px');s.setProperty('--lh',LH+'px');
    // 地圖是 3:2，橫向手機兩側會空出一條；夠寬（58px 以上）就把按鈕、密語、頭像移過去
    const gut=Math.floor((LW-Math.min(LW,LH*1.5))/2);s.setProperty('--gut',gut+'px');b.classList.toggle('gutter',phone&&gut>=58)}
  function setScreen(s){const b=document.body;b.classList.remove('pick','club');b.classList.add(s);layout();window.scrollTo(0,0)}
  const tools=document.querySelector('.tools');document.getElementById('toolbtn').onclick=()=>tools.classList.toggle('open');
  // 全螢幕：Android Chrome 可以全螢幕並鎖橫向；iPhone Safari 不支援，按鈕就不顯示
  const fs=document.getElementById('fsbtn');if(document.fullscreenEnabled&&document.documentElement.requestFullscreen)fs.classList.add('can');
  fs.onclick=()=>{const d=document;if(d.fullscreenElement){d.exitFullscreen();return}
    d.documentElement.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}setTimeout(layout,300)}).catch(()=>{})};
  document.addEventListener('fullscreenchange',()=>{fs.textContent=document.fullscreenElement?'離開全螢幕':'全螢幕';setTimeout(layout,300)});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else if(!(window.CG&&CG.isOpen()&&CG.rhythm()))tryPlay()});
  window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>setTimeout(layout,200));layout();
  // 給畫布換算點擊位置用：強制橫向時，畫面轉了 90 度，座標也要跟著轉
  window.mapPt=(el,e,W,H)=>{const r=el.getBoundingClientRect();
    if(document.body.classList.contains('forceland'))return{x:(e.clientY-r.top)/r.height*W,y:(r.right-e.clientX)/r.width*H};
    return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
})();
</script>
